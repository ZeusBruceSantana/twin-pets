# Runs the Twin Pets tests (tests/index.html) on every pull request and every change to main.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install a test browser
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Run the tests
        run: node tests/run-in-ci.js
