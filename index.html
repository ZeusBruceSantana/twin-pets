<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twin Pets">
<meta name="application-name" content="Twin Pets">
<meta name="theme-color" content="#fff8ef">
<meta name="format-detection" content="telephone=no">
<title>Twin Pets</title>
<style>
/* =====================================================================
   LOOK AND FEEL
   Colors for each girl's side are filled in by the game after she picks.
   ===================================================================== */
:root {
  --L: #c9c3d3; --L-light: #f3f0ec; --L-dark: #6f6880;
  --R: #c9c3d3; --R-light: #f3f0ec; --R-dark: #6f6880;
  --col: 19vmin;            /* width of each girl's button strip */
  --btn: 16vmin;            /* size of each button */
  --pet: 33vmin;            /* size of each pet */
  --ink: #3e3a4f;
  --font: ui-rounded, "SF Pro Rounded", "Century Gothic", "Segoe UI", system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
}
* {
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0; height: 100%; overflow: hidden;
  overscroll-behavior: none; touch-action: none;
  background: #fff8ef; color: var(--ink); font-family: var(--font);
}
body { position: fixed; inset: 0; }
svg { display: block; }

#stage { position: fixed; inset: 0; overflow: hidden; background: #fff8ef; }

/* ---------- background ---------- */
.cloud {
  position: absolute; width: 20vmin; height: 7vmin; background: #fff; border-radius: 7vmin; opacity: .85;
  animation: drift 90s linear infinite;
}
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 9vmin; height: 9vmin; left: 3vmin; top: -4.5vmin; }
.cloud::after  { width: 7vmin; height: 7vmin; left: 9.5vmin; top: -3vmin; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

/* night on one half (one pet asleep) and on the whole screen (both asleep) */
.half-night {
  position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; pointer-events: none;
  background: linear-gradient(#24306a, #46559a); opacity: 0; transition: opacity 1.6s ease;
}
.half-night.left { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 80%, transparent); mask-image: linear-gradient(90deg, #000 80%, transparent); }
.half-night.right { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 80%, transparent); mask-image: linear-gradient(270deg, #000 80%, transparent); }
.half-night.on { opacity: .5; }
#night {
  position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 2.5s ease;
  background: linear-gradient(#141c48, #34407e 70%, #4a5a96);
}
#night.on { opacity: .82; }
.star { position: absolute; width: 1.2vmin; height: 1.2vmin; background: #fff6c8; border-radius: 50%; animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.1); } }
#moon { position: absolute; left: 61%; top: calc(13vmin + var(--safe-top)); width: 12vmin; height: 12vmin; transform: translateX(-50%); }
#moon svg { width: 100%; height: 100%; }
#goodnight {
  position: absolute; left: 50%; top: 27%; transform: translateX(-50%); z-index: 25;
  font: 900 8vmin/1 var(--font); color: #fff6c8; text-shadow: 0 .6vmin 0 rgba(0,0,0,.25);
  opacity: 0; transition: opacity 1.5s ease; pointer-events: none; white-space: nowrap;
}
#goodnight.on { opacity: 1; pointer-events: auto; }

/* ---------- names at the top ---------- */
.girl-name {
  position: absolute; top: calc(2.5vmin + var(--safe-top)); transform: translateX(-50%); z-index: 6;
  font: 900 6vmin/1 var(--font); padding: 1vmin 3.2vmin; border-radius: 5vmin;
  background: rgba(255,255,255,.75);
}
#name-left  { left: 29.5%; color: var(--L-dark); }
#name-right { left: 70.5%; color: var(--R-dark); }

/* ---------- the world: pets and flying things ---------- */
#world { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#world > * { pointer-events: none; }   /* flying hearts, sparkles and food never block a tap */
.pet { position: absolute; width: var(--pet); height: var(--pet); transform: translateX(-50%); z-index: 10; }
/* only the pet itself catches taps, not the empty space around it */
.pet .lean, .pet .tag, .pet .say, .pet .thought { pointer-events: auto; }
.pet .lean, .pet .bounce, .pet .art { position: absolute; inset: 0; transform-origin: 50% 100%; }
.pet .lean { transition: transform .35s ease; }
.pet .art { transition: transform .7s ease; }
.pet .art > svg { width: 100%; height: 100%; overflow: visible; }
.pet.asleep .art { transform: translateY(5%) scaleY(.86) scaleX(1.05); }
.pet.walking .bounce { animation: hop .3s ease-in-out infinite alternate; }
.pet.running .bounce { animation: hop .2s ease-in-out infinite alternate; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6%); } }

/* your own pictures (see PET ART in the script) */
.art.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; -webkit-user-drag: none; }
.art.photo .img-asleep { display: none; }
.asleep .art.photo.has-asleep { transform: none; }
.asleep .art.photo.has-asleep .img-awake { display: none; }
.asleep .art.photo.has-asleep .img-asleep { display: block; }

/* faces: which eyes and mouth show */
.pet-svg .eyes-happy, .pet-svg .eyes-closed, .pet-svg .mouth-open, .pet-svg .tail-front { display: none; }
.happy .pet-svg .eyes-open { display: none; }
.happy .pet-svg .eyes-happy { display: inline; }
.happy .pet-svg .mouth-closed, .chomp .pet-svg .mouth-closed { display: none; }
.happy .pet-svg .mouth-open, .chomp .pet-svg .mouth-open { display: inline; }
.asleep .pet-svg .eyes-open, .asleep .pet-svg .eyes-happy, .asleep .pet-svg .mouth-open { display: none; }
.asleep .pet-svg .eyes-closed, .asleep .pet-svg .mouth-closed { display: inline; }
.asleep .pet-svg .tail { display: none; }
.asleep .pet-svg .tail-front { display: inline; }
.pet-svg .head { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .7s ease; }
.asleep .pet-svg .head { transform: translateY(12px) rotate(-7deg); }
.pet-svg .eyes-open { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.side-right .pet-svg .eyes-open { animation-delay: -2.2s; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.pet-svg .tail { transform-box: fill-box; transform-origin: 0% 100%; }
.wag .pet-svg .tail { animation: wag .26s ease-in-out 6 alternate; }
@keyframes wag { from { transform: rotate(-9deg); } to { transform: rotate(11deg); } }

.zzz { position: absolute; right: 8%; top: 18%; display: none; pointer-events: none; font: 900 5vmin/1 var(--font); color: #8193d6; }
.asleep .zzz { display: block; }
.zzz span { position: absolute; opacity: 0; animation: zfloat 3.2s linear infinite; }
.zzz span:nth-child(2) { animation-delay: 1.05s; font-size: .8em; }
.zzz span:nth-child(3) { animation-delay: 2.1s; font-size: 1.25em; }
@keyframes zfloat { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(5vmin,-11vmin); opacity: 0; } }

.tag {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, .2vmin); white-space: nowrap;
  font: 900 3.6vmin/1 var(--font); padding: .8vmin 2.4vmin; border-radius: 4vmin;
  background: #fff; border: .5vmin solid var(--c); color: var(--c-dark); transition: opacity .4s;
}
.side-left  { --c: var(--L); --c-dark: var(--L-dark); --c-light: var(--L-light); }
.side-right { --c: var(--R); --c-dark: var(--R-dark); --c-light: var(--R-light); }
body:not([data-scene="play"]):not([data-scene="title"]) .tag, .pet.asleep .tag { opacity: 0; pointer-events: none; }

.say {
  position: absolute; left: 50%; bottom: 96%; transform: translateX(-50%); z-index: 30;
  background: #fff; border-radius: 4vmin; padding: 1.6vmin 3vmin; white-space: nowrap;
  font: 900 4.6vmin/1.15 var(--font); color: var(--ink); box-shadow: 0 1vmin 0 rgba(0,0,0,.08);
}
.say::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -2vmin; border: 2vmin solid transparent; border-top-color: #fff; }

.prop { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
.prop > div { width: 100%; height: 100%; }
.prop svg { width: 100%; height: 100%; overflow: visible; }

/* words you can tap to hear */
.word { display: inline-block; cursor: pointer; }
.word.said { animation: said .45s ease; }
@keyframes said { 40% { transform: scale(1.25) translateY(-.8vmin); color: #ff5d8f; } }

/* ---------- each girl's button strip ---------- */
.column {
  position: absolute; top: 0; bottom: 0; width: var(--col); z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin;
  padding: calc(11vmin + var(--safe-top)) 0 3vmin;
}
.column::before { content: ''; position: absolute; inset: 0; background: var(--c); opacity: .2; z-index: -1; }
.column.left  { left: 0;  --c: var(--L); --c-dark: var(--L-dark); --c-light: var(--L-light); }
.column.right { right: 0; --c: var(--R); --c-dark: var(--R-dark); --c-light: var(--R-light); }
.column.left::before  { border-radius: 0 6vmin 6vmin 0; }
.column.right::before { border-radius: 6vmin 0 0 6vmin; }
.btn {
  position: relative; width: var(--btn); height: var(--btn); flex: none;
  border-radius: 4.5vmin; background: #fff; border: .9vmin solid var(--c);
  box-shadow: 0 1.2vmin 0 var(--c-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--c-dark); font: 900 3.4vmin/1 var(--font);
  transition: transform .08s ease, box-shadow .08s ease, opacity .4s ease;
}
.btn .ico { width: 9.5vmin; height: 9.5vmin; pointer-events: none; }
.btn .ico > svg { width: 100%; height: 100%; overflow: visible; }
.btn .lbl { margin-top: .5vmin; pointer-events: none; text-align: center; line-height: 1.05; }
.btn.down { transform: translateY(.9vmin) scale(.96); box-shadow: 0 .3vmin 0 var(--c-dark); }
.column.big .btn { width: 17vmin; height: 46vmin; border-radius: 6vmin; }
.column.big .btn .ico { width: 13vmin; height: 13vmin; }
.column.big .btn .lbl { font-size: 4vmin; margin-top: 1.5vmin; }
.column.dim .btn { opacity: .4; }
.btn.nudge { animation: nudge .4s ease; }
@keyframes nudge { 20% { transform: translateX(-1.2vmin); } 40% { transform: translateX(1.2vmin); } 60% { transform: translateX(-.8vmin); } 80% { transform: translateX(.6vmin); } }
.btn.invite { animation: invite .7s ease-in-out infinite alternate; }
@keyframes invite { from { box-shadow: 0 1.2vmin 0 var(--c-dark), 0 0 0 0 var(--c); } to { box-shadow: 0 1.2vmin 0 var(--c-dark), 0 0 0 1.6vmin var(--c); } }
.btn.new { animation: newbtn 1s ease-out, invite .7s ease-in-out 1s 8 alternate; }
@keyframes newbtn { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.18) rotate(6deg); } 100% { transform: scale(1); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* ---------- the shared middle: friendship jar and together games ---------- */
#center { position: absolute; left: 50%; top: 0; bottom: 0; width: 16vmin; transform: translateX(-50%); z-index: 9; pointer-events: none; }
#center > * { pointer-events: auto; }
#jar { position: absolute; left: 50%; top: calc(1.5vmin + var(--safe-top)); width: 15vmin; height: 18.6vmin; transform: translateX(-50%); display: none; transition: opacity .8s ease; }
#jar.show { display: block; }
#jar > svg { width: 100%; height: 100%; overflow: visible; }
#jar.wiggle { animation: jarwiggle .5s ease; }
@keyframes jarwiggle { 25% { transform: translateX(-50%) rotate(-7deg) scale(1.06); } 75% { transform: translateX(-50%) rotate(6deg) scale(1.06); } }
#jar.full { animation: jarglow .8s ease-in-out infinite alternate; }
@keyframes jarglow { from { filter: drop-shadow(0 0 0 #ffd23f); transform: translateX(-50%) scale(1); } to { filter: drop-shadow(0 0 2.5vmin #ffd23f); transform: translateX(-50%) scale(1.08); } }
#jar.pop { animation: jarpop .9s ease-out; }
@keyframes jarpop { 0% { transform: translateX(-50%) translateY(-30vmin); } 60% { transform: translateX(-50%) translateY(2vmin); } 100% { transform: translateX(-50%) translateY(0); } }
.cbtn {
  width: 12.5vmin; height: 12.5vmin; border-radius: 50%; padding: 1.8vmin; flex: none;
  border: .9vmin solid transparent;
  background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, var(--L) 50%, var(--R) 50%) border-box;
  box-shadow: 0 1vmin 0 rgba(0,0,0,.15); transition: transform .08s ease, opacity .4s ease;
}
.cbtn > svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cbtn svg { pointer-events: none; }
.cbtn.down { transform: translateY(.8vmin); box-shadow: 0 .2vmin 0 rgba(0,0,0,.15); }
.cbtn.nudge { animation: nudge .4s ease; }
#gamebar { position: absolute; left: 50%; top: calc(22vmin + var(--safe-top)); transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 2.4vmin; }
body[data-scene="game"] #gamebar { display: flex; }
#dots { display: grid; grid-template-columns: repeat(4, 3.4vmin); gap: .8vmin; }
#dots i { width: 3.4vmin; height: 3.4vmin; display: block; }
#dots i svg { width: 100%; height: 100%; }
#home-btn { width: 10vmin; height: 10vmin; padding: 1.4vmin; }
.column.big .btn.done { opacity: .45; }

/* ---------- surprises ---------- */
.scenery { position: absolute; pointer-events: none; }
.scenery svg { width: 100%; height: 100%; overflow: visible; }
#party { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 1s ease; overflow: hidden; background: linear-gradient(#2a1b4d, #4b2a6e); }
#party.on { opacity: .82; }
.light { position: absolute; width: 46vmin; height: 46vmin; border-radius: 50%; mix-blend-mode: screen; opacity: .7; animation: roam 4s ease-in-out infinite alternate; }
@keyframes roam { from { transform: translate(-12vmin, -6vmin) scale(.8); } to { transform: translate(14vmin, 8vmin) scale(1.15); } }
.seesaw-plank {
  position: absolute; height: 2.8vmin; z-index: 9; border-radius: 2vmin; border: .5vmin solid #fff;
  background: linear-gradient(90deg, var(--L) 50%, var(--R) 50%); box-shadow: 0 .6vmin 0 rgba(0,0,0,.15);
}
.seesaw-base { position: absolute; z-index: 8; }
.seesaw-base svg { width: 100%; height: 100%; }

/* ---------- thought bubbles ---------- */
.thought {
  position: absolute; left: 50%; bottom: 93%; z-index: 29; width: 19vmin; padding: 1.6vmin 1vmin 1.2vmin;
  background: #fff; border-radius: 50% / 45%; box-shadow: 0 1vmin 0 rgba(0,0,0,.08);
  display: flex; flex-direction: column; align-items: center; transform: translateX(-50%);
}
.thought::before, .thought::after { content: ''; position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 .5vmin 0 rgba(0,0,0,.06); }
.thought::before { width: 3.4vmin; height: 3.4vmin; left: 44%; bottom: -3.2vmin; }
.thought::after  { width: 2vmin; height: 2vmin; left: 52%; bottom: -5.6vmin; }
.thought .pic { width: 10vmin; height: 10vmin; pointer-events: none; }
.thought .pic svg { width: 100%; height: 100%; overflow: visible; }
.thought .say-word { font: 900 5.6vmin/1 var(--font); color: var(--ink); pointer-events: none; }
.thought.word.said { animation: said-bubble .45s ease; }
@keyframes said-bubble { 40% { transform: translateX(-50%) scale(1.15); } }
body:not([data-scene="play"]) .thought, .pet.saying .thought { visibility: hidden; }

/* ---------- memory book ---------- */
#book { align-items: center; justify-content: center; background: rgba(60,50,80,.45); z-index: 70; }
.book {
  position: relative; width: min(74vw, 112vmin); height: 66vmin; display: flex;
  background: #fffdf8; border-radius: 3vmin; border: 1vmin solid #ecd9b8;
  box-shadow: 0 1.6vmin 0 #d4bd96, 0 3vmin 8vmin rgba(0,0,0,.3);
}
.book::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: .6vmin; margin-left: -.3vmin; background: #ecd9b8; }
.page { flex: 1; padding: 3vmin; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.6vmin; min-width: 0; }
.page.lp { background: linear-gradient(90deg, #fffdf8 70%, #f6ecdb); border-radius: 2vmin 0 0 2vmin; }
.page.rp { background: linear-gradient(270deg, #fffdf8 70%, #f6ecdb); border-radius: 0 2vmin 2vmin 0; }
.book-pets { display: flex; gap: 1vmin; }
.book-pets > div { position: relative; width: 21vmin; height: 21vmin; }
.book-pets > div > svg { width: 100%; height: 100%; overflow: visible; }
.book-pics { display: flex; flex-wrap: wrap; gap: 1.4vmin; justify-content: center; max-width: 40vmin; }
.book-pics > div { width: 8vmin; height: 8vmin; }
.book-pics svg { width: 100%; height: 100%; overflow: visible; }
.book-day { font: 900 4.6vmin/1 var(--font); color: #b0884f; }
.book-line { font: 900 5.4vmin/1.35 var(--font); text-align: center; color: var(--ink); }
.book-line .word { margin: 0 .2vmin; }
.say-all { width: 11vmin; height: 11vmin; border-radius: 50%; background: #fff3d6; border: .8vmin solid #ffd27a; padding: 1.8vmin; }
.say-all svg { width: 100%; height: 100%; pointer-events: none; }
.book-btn {
  position: absolute; width: 12vmin; height: 12vmin; border-radius: 50%; background: #fff; padding: 2.4vmin;
  border: .8vmin solid #ecd9b8; box-shadow: 0 1vmin 0 #d4bd96; z-index: 2;
}
.book-btn svg { width: 100%; height: 100%; pointer-events: none; }
.book-btn.down { transform: translateY(.8vmin); box-shadow: 0 .2vmin 0 #d4bd96; }
.book-btn.off { opacity: .25; pointer-events: none; }
.book-prev { left: -6vmin; top: 50%; margin-top: -6vmin; }
.book-next { right: -6vmin; top: 50%; margin-top: -6vmin; }
.book-close { right: -4.5vmin; top: -4.5vmin; width: 10.5vmin; height: 10.5vmin; padding: 2.4vmin; }

/* =====================================================================
   THE HOUSE: rooms, doors, and room things
   ===================================================================== */
#rooms { position: absolute; inset: 0; z-index: 0; }
.room { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s; pointer-events: none; overflow: hidden; }
.room.on { opacity: 1; visibility: visible; transition: opacity .6s ease, visibility 0s; }
.room .wall { position: absolute; left: 0; right: 0; top: 0; bottom: 28%; }
.room .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 28%; border-top: 1.2vmin solid rgba(255,255,255,.7); }
.room .tint { position: absolute; top: 0; bottom: 0; width: 50%; opacity: .5; }
.room .tint.l { left: 0; background: linear-gradient(90deg, var(--L-light) 55%, transparent); }
.room .tint.r { right: 0; background: linear-gradient(270deg, var(--R-light) 55%, transparent); }
.deco { position: absolute; }
.deco > svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* playroom */
.room-playroom .wall { background: radial-gradient(circle, rgba(255,255,255,.75) 16%, transparent 18%) 0 0 / 7vmin 7vmin, #fff0cf; }
.room-playroom .floor { background: repeating-linear-gradient(90deg, #ebca9d 0 13vmin, #dfb989 13vmin 13.4vmin); }
.room-playroom .rug { left: 50%; bottom: 3%; width: 78%; height: 15%; transform: translateX(-50%); }
.shelf { position: absolute; top: 27%; width: 20%; height: 1.6vmin; background: #c99a6b; border-radius: .8vmin; box-shadow: 0 .6vmin 0 #a8743f; }
.shelf.l { left: 19.5%; } .shelf.r { left: 60.5%; }
.toys { position: absolute; left: 0; right: 0; bottom: 100%; display: flex; justify-content: center; align-items: flex-end; gap: .8vmin; }
.toys > div { width: 6.5vmin; height: 6.5vmin; }
.toys svg { width: 100%; height: 100%; overflow: visible; }

/* kitchen */
.room-kitchen .wall {
  background: repeating-linear-gradient(0deg, transparent 0 6vmin, rgba(255,255,255,.75) 6vmin 6.3vmin),
              repeating-linear-gradient(90deg, transparent 0 6vmin, rgba(255,255,255,.75) 6vmin 6.3vmin), #d4edf7;
}
.room-kitchen .counter { position: absolute; left: 0; right: 0; bottom: 28%; height: 11%; background: repeating-linear-gradient(90deg, #f8e7cb 0 15vmin, #e8cfa8 15vmin 15.4vmin); border-top: 1.8vmin solid #e2c49a; }
.room-kitchen .floor { background: repeating-conic-gradient(#fff7ea 0 25%, #f1dcbd 0 50%) 0 0 / 10vmin 10vmin; }
.bowl { bottom: 3%; width: 12vmin; height: 5.6vmin; transform: translateX(-50%); }
.bowl.side-left { left: 44%; } .bowl.side-right { left: 56%; }

/* bathroom */
.room-bathroom .wall {
  background: repeating-linear-gradient(0deg, transparent 0 7vmin, rgba(255,255,255,.8) 7vmin 7.3vmin),
              repeating-linear-gradient(90deg, transparent 0 7vmin, rgba(255,255,255,.8) 7vmin 7.3vmin), #d5f2e8;
}
.room-bathroom .floor { background: repeating-conic-gradient(#eef6fb 0 25%, #dbe9f3 0 50%) 0 0 / 8vmin 8vmin; }
.towel { top: 15%; width: 9vmin; height: 19vmin; }
.towel.side-left { left: 18%; } .towel.side-right { right: 18%; }
.bub { position: absolute; bottom: -8vmin; width: 5vmin; height: 5vmin; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 18%, rgba(255,255,255,.35) 20%, rgba(190,230,255,.35) 70%); border: .3vmin solid rgba(255,255,255,.8); animation: bubbleup 14s linear infinite; }
@keyframes bubbleup { from { transform: translateY(0) translateX(0); } 50% { transform: translateY(-55vh) translateX(3vmin); } to { transform: translateY(-115vh) translateX(-2vmin); } }

/* backyard */
.room-backyard .sky { position: absolute; inset: 0; background: linear-gradient(90deg, var(--L-light) 0%, var(--L-light) 36%, #fffaf3 50%, var(--R-light) 64%, var(--R-light) 100%); }
.room-backyard .ground { position: absolute; left: 0; bottom: 0; width: 100%; height: 32%; }
.fence { position: absolute; left: 0; right: 0; bottom: 25%; height: 10%; opacity: .9;
  background: linear-gradient(#fff, #fff) 0 30% / 100% .9vmin no-repeat, linear-gradient(#fff, #fff) 0 72% / 100% .9vmin no-repeat,
              repeating-linear-gradient(90deg, #fff 0 2.4vmin, transparent 2.4vmin 5vmin); }
.tramp { bottom: calc(12% - 8.3vmin); width: 36vmin; height: 10.8vmin; transform: translateX(-50%); }
.tramp.side-left { left: 29.5%; } .tramp.side-right { left: 70.5%; }
.tramp .mat { transform-box: fill-box; transform-origin: 50% 50%; }

/* bedroom */
.room-bedroom .wall { background: radial-gradient(circle, rgba(255,255,255,.9) 7%, transparent 9%) 0 0 / 8vmin 8vmin, #ece5fb; }
.room-bedroom .floor { background: #ddd0f2; }
.bwindow { top: 15%; width: 15vmin; height: 15vmin; }
.bwindow.side-left { left: 18%; } .bwindow.side-right { right: 18%; }
.win-sky { fill: #bfe6ff; transition: fill 2s ease; }
.win-night { opacity: 0; transition: opacity 2s ease; }
body[data-scene="goodnight"] .win-sky, body[data-scene="night"] .win-sky { fill: #2c3672; }
body[data-scene="goodnight"] .win-night, body[data-scene="night"] .win-night { opacity: 1; }
.bed { bottom: calc(12% - 5vmin); width: 36vmin; height: 10vmin; transform: translateX(-50%); }
.bed.side-left { left: 29.5%; } .bed.side-right { left: 70.5%; }
.cushion { left: 50%; bottom: calc(12% - 5vmin); width: 44vmin; height: 10vmin; transform: translateX(-50%); }

/* ---------- doors in the shared middle ---------- */
#doors { position: absolute; left: 50%; top: calc(21.5vmin + var(--safe-top)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 1.2vmin; align-items: center; transition: opacity .4s ease; }
body:not([data-scene="play"]) #doors { opacity: 0; pointer-events: none; }
.door {
  position: relative; width: 15vmin; height: 11.6vmin; flex: none;
  border-radius: 7.5vmin 7.5vmin 1.6vmin 1.6vmin; background: var(--door); border: .6vmin solid #fff;
  box-shadow: 0 .8vmin 0 rgba(0,0,0,.14); transition: box-shadow .3s ease, transform .15s ease, opacity .3s ease;
}
.door::before { content: ''; position: absolute; left: 50%; top: 18%; bottom: 0; width: .35vmin; background: rgba(255,255,255,.55); transform: translateX(-50%); }
.door-ico { position: absolute; left: 50%; top: .6vmin; width: 6.6vmin; height: 6.6vmin; transform: translateX(-50%); pointer-events: none; }
.door-ico svg { width: 100%; height: 100%; overflow: visible; }
.door-half { position: absolute; top: 0; bottom: 0; width: 50%; }
.door-half.l { left: 0; } .door-half.r { right: 0; }
.door-face { position: absolute; bottom: .7vmin; width: 4.4vmin; height: 4.4vmin; border-radius: 50%; overflow: hidden; background: #fff; border: .45vmin solid #fff; opacity: .55; pointer-events: none; }
.door-half.l .door-face { left: .7vmin; border-color: var(--L); }
.door-half.r .door-face { right: .7vmin; border-color: var(--R); }
.door-face svg, .door-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
.door.here { opacity: .45; background: linear-gradient(#6b5a4a, #8a7461); }
.door.here .door-face { display: none; }
.door.vote-left, .door.vote-right { box-shadow: 0 .8vmin 0 rgba(0,0,0,.14), 0 0 0 .9vmin #ffe57f, 0 0 4vmin #ffd23f; transform: scale(1.06); }
.door.vote-left .door-half.l .door-face, .door.vote-right .door-half.r .door-face { opacity: 1; transform: scale(1.12); }
.door.vote-left:not(.vote-right) .door-half.r .door-face,
.door.vote-right:not(.vote-left) .door-half.l .door-face { animation: faceblink .55s ease-in-out infinite alternate; }
@keyframes faceblink { from { opacity: .35; transform: scale(.95); } to { opacity: 1; transform: scale(1.25); } }
.door.down { transform: scale(.95); }
.door.nudge { animation: nudge .4s ease; }
.door .badge { position: absolute; right: -1.6vmin; top: -1.4vmin; width: 5vmin; height: 5vmin; color: #ffc93c; filter: drop-shadow(0 .3vmin 0 #e0a800); animation: pulse 1.2s ease-in-out infinite; pointer-events: none; }
.door .badge svg { width: 100%; height: 100%; }
#doors.hint .door:not(.here) { animation: doorhint 1.2s ease-in-out 3; }
#doors.hint .door:nth-child(2) { animation-delay: .15s; } #doors.hint .door:nth-child(3) { animation-delay: .3s; }
#doors.hint .door:nth-child(4) { animation-delay: .45s; } #doors.hint .door:nth-child(5) { animation-delay: .6s; }
@keyframes doorhint { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.1); box-shadow: 0 0 0 .9vmin #ffe57f; } }
body[data-scene="game"] #gamebar, body[data-scene="climb"] #gamebar { display: flex; }
body[data-scene="climb"] #dots { display: none; }

/* first visit hint */
#hint {
  position: absolute; left: 50%; bottom: 2.5vmin; z-index: 40; transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
  display: flex; align-items: center; gap: 1.6vmin; padding: 1.2vmin 3vmin 1.2vmin 1.6vmin; border-radius: 6vmin;
  background: #fff; box-shadow: 0 1.2vmin 0 rgba(0,0,0,.1), 0 0 0 1vmin rgba(255,229,127,.8);
  transition: transform .45s cubic-bezier(.3,1.6,.6,1); pointer-events: none;
}
#hint.show { transform: translateX(-50%) scale(1); }
#hint .hint-ico { width: 6.6vmin; height: 6.6vmin; } #hint .hint-ico svg { width: 100%; height: 100%; }
#hint .hint-word { font: 900 4.6vmin/1 var(--font); color: var(--ink); pointer-events: auto; }

/* ---------- things on the pets: tummy, mud, fluff, clothes ---------- */
.pet-svg .body { transform-box: fill-box; transform-origin: 50% 65%; transition: transform .8s cubic-bezier(.3,1.5,.6,1); }
.pet-svg .fluff { display: none; }
.fluffy .pet-svg .fluff { display: inline; }
.pet.fluffy .art { filter: drop-shadow(0 0 1vmin rgba(255,255,255,.95)) drop-shadow(0 0 2.2vmin rgba(255,236,170,.75)); }
.glitter { position: absolute; inset: 0; pointer-events: none; display: none; }
.pet.fluffy .glitter { display: block; }
.glitter i { position: absolute; width: 3.2vmin; height: 3.2vmin; color: #ffe066; animation: glint 1.8s ease-in-out infinite; }
.glitter i svg { width: 100%; height: 100%; }
@keyframes glint { 0%, 100% { transform: scale(.2) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.art .mud, .art .wear, .art .foam { position: absolute; pointer-events: none; }
.art .mud svg, .art .wear svg { width: 100%; height: 100%; overflow: visible; display: block; }
.art .foam { border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0 40%, #eaf6ff 70%); box-shadow: 0 0 0 .3vmin rgba(255,255,255,.8); }
.wear { transform-origin: 50% 100%; transition: transform .7s ease; }
.asleep .wear.head { transform: translate(-8%, 30%) rotate(-8deg); }

/* ---------- bath, trampoline, rainbow ---------- */
.tub { position: absolute; z-index: 11; pointer-events: none; transform: translateX(-50%); }
.tub svg { width: 100%; height: 100%; overflow: visible; }
.tub .water { transform-box: fill-box; transform-origin: 50% 100%; }
#world > .duck { pointer-events: auto; }
.duck { position: absolute; z-index: 12; width: 8vmin; height: 8vmin; transform: translate(-50%, -50%); animation: bob 1.6s ease-in-out infinite; }
.duck svg { width: 100%; height: 100%; }
@keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -1vmin; } }
.rainbow { position: absolute; left: 50%; bottom: 10%; width: 60%; height: 44%; transform: translateX(-50%); transform-origin: 50% 100%; z-index: 8; pointer-events: none; }
.rainbow svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- playroom: trick cards and presents ---------- */
.column.cards { gap: 1.2vmin; padding-top: calc(9.5vmin + var(--safe-top)); }
.column.cards .btn { height: 11vmin; border-radius: 3vmin; flex-direction: row; justify-content: flex-start; gap: .8vmin; padding: 0 1vmin; box-shadow: 0 .9vmin 0 var(--c-dark); }
.column.cards .btn .ico { width: 6.4vmin; height: 6.4vmin; flex: none; }
.column.cards .btn .lbl { margin: 0; font-size: 3.1vmin; text-align: left; }
.column.cards .btn-back { justify-content: center; height: 9vmin; }
.btn.learned { border-color: #ffc93c; background: #fffbea; }
.btn .star { position: absolute; right: -1.4vmin; top: -1.4vmin; width: 4.6vmin; height: 4.6vmin; color: #ffc93c; filter: drop-shadow(0 .3vmin 0 #e0a800); }
.btn .star svg { width: 100%; height: 100%; }
.tricklist { position: absolute; top: calc(11.6vmin + var(--safe-top)); transform: translateX(-50%); z-index: 6; display: none; gap: .8vmin; }
#tricks-left { left: 29.5%; } #tricks-right { left: 70.5%; }
body[data-room="playroom"] .tricklist { display: flex; }
.tricklist > div { width: 5.4vmin; height: 5.4vmin; padding: .7vmin; border-radius: 50%; background: #fffbea; border: .45vmin solid #ffc93c; }
.tricklist svg { width: 100%; height: 100%; }
.present { position: absolute; z-index: 13; width: 13vmin; height: 13vmin; transform: translate(-50%, -50%); }
.present svg { width: 100%; height: 100%; overflow: visible; }
.present g { transform-box: fill-box; transform-origin: 50% 100%; }

.foamball { position: absolute; z-index: 12; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 35% 35%, #fff 0 40%, #e3f4ff 75%); box-shadow: 0 0 0 .3vmin rgba(255,255,255,.9); }

/* ---------- big round buttons and overlays ---------- */
.round-btn {
  width: 18vmin; height: 18vmin; border-radius: 50%; background: #5cc77a; border: 1vmin solid #fff;
  box-shadow: 0 1.4vmin 0 #33935a, 0 0 0 1vmin rgba(92,199,122,.25);
  display: flex; align-items: center; justify-content: center; padding: 3.5vmin;
}
.round-btn svg { width: 100%; height: 100%; }
.round-btn.down { transform: translateY(1vmin); box-shadow: 0 .4vmin 0 #33935a; }
.overlay { position: absolute; inset: 0; z-index: 60; display: none; }
.overlay.show { display: flex; }
#title { align-items: center; justify-content: center; background: rgba(255,248,239,.35); }

/* color picker */
#picker { background: #fff8ef; }
.pick-half {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vmin;
  background: var(--pbg, #f4efe9); transition: background .4s ease;
}
.pick-name { font: 900 8vmin/1 var(--font); color: var(--pdark, #6f6880); }
.pick-pet { position: relative; width: 25vmin; height: 25vmin; }
.pick-pet > svg { width: 100%; height: 100%; overflow: visible; }
.swatches { display: grid; grid-template-columns: repeat(4, 11vmin); gap: 2.2vmin; }
.swatch {
  width: 11vmin; height: 11vmin; border-radius: 50%; background: var(--sw);
  border: .9vmin solid #fff; box-shadow: 0 .8vmin 0 rgba(0,0,0,.14);
  display: flex; align-items: center; justify-content: center; transition: transform .2s ease, opacity .3s ease;
}
.swatch svg { width: 60%; height: 60%; display: none; }
.swatch.chosen { transform: scale(1.15); border-color: var(--ink); }
.swatch.chosen svg { display: block; }
.swatch.taken { opacity: .15; }
.swatch.nudge { animation: nudge .4s ease; }
.pick-mid { width: 22vmin; display: flex; align-items: center; justify-content: center; }
#go-btn { visibility: hidden; }
#go-btn.show { visibility: visible; animation: newbtn .6s ease-out, pulse 1.6s ease-in-out .6s infinite; }

/* grown-up panel */
#parent { align-items: center; justify-content: center; background: rgba(40,36,56,.55); z-index: 90; }
.panel {
  background: #fff; border-radius: 4vmin; padding: 3vmin 4vmin; min-width: 60vmin; max-height: 94%;
  font: 700 3.2vmin/1.2 var(--font); color: var(--ink); box-shadow: 0 2vmin 6vmin rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 1.6vmin;
}
.panel h2 { margin: 0 0 1vmin; font-size: 4.4vmin; text-align: center; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; }
.panel .row > span { min-width: 16vmin; }
.pbtn {
  border-radius: 2.4vmin; background: #f1eef7; border: .5vmin solid #d9d3e6; padding: 1.6vmin 2.6vmin;
  font: 800 3.2vmin/1 var(--font); color: var(--ink); text-align: center; flex: 1;
}
.pbtn.round { flex: none; width: 8vmin; height: 8vmin; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 5vmin; }
.pbtn.go { background: #5cc77a; border-color: #33935a; color: #fff; }
.pbtn.danger { background: #fff0f0; border-color: #f2b8b8; color: #b03a3a; }
.pbtn.danger.confirm { background: #e05555; border-color: #b03a3a; color: #fff; }
.pbtn.on { background: #e5f7ea; border-color: #8fd1a3; }
.pbtn.down { transform: scale(.96); }
.volbar { display: flex; gap: .8vmin; flex: 1; justify-content: center; }
.volbar i { width: 3vmin; height: 6vmin; border-radius: 1vmin; background: #e6e1ef; }
.volbar i.on { background: #8b7fd1; }
.panel .note { font-size: 2.4vmin; color: #857f96; text-align: center; font-weight: 600; }

/* hidden grown-up corner (top-left) */
#corner { position: absolute; left: 0; top: 0; width: 11vmin; height: calc(11vmin + var(--safe-top)); z-index: 100; }
#corner svg { position: absolute; left: 1.5vmin; top: calc(1.5vmin + var(--safe-top)); width: 8vmin; height: 8vmin; opacity: 0; transition: opacity .3s; }
#corner.holding svg { opacity: 1; }
#corner circle.ring { stroke-dasharray: 126; stroke-dashoffset: 126; transform: rotate(-90deg); transform-origin: 50% 50%; }
#corner.holding circle.ring { stroke-dashoffset: 0; transition: stroke-dashoffset 2.6s linear; }

/* please turn sideways */
#rotate {
  position: fixed; inset: 0; z-index: 200; background: #fff8ef; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
}
#rotate svg { width: 30vmin; height: 30vmin; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>

const Speech = {
  voice: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const choose = () => {
      const voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
      const liked = [/Aria/i, /Jenny/i, /Ava/i, /Samantha/i, /Natural/i, /Zira/i, /Karen/i, /Google US English/i];
      for (const re of liked) {
        const v = voices.find(x => re.test(x.name));
        if (v) { this.voice = v; return; }
      }
      this.voice = voices.find(v => /en[-_]US/i.test(v.lang)) || voices[0] || null;
    };
    choose();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', choose);
    else speechSynthesis.onvoiceschanged = choose;
  },
  say(text) {
    if (!text || S.sound.muted || !('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.1;
      u.volume = Math.max(0.3, S.sound.volume);
      if (this.voice) u.voice = this.voice;
      if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel();
        setTimeout(() => speechSynthesis.speak(u), 80);
      } else {
        speechSynthesis.speak(u);
      }
    } catch (e) { /* ignore */ }
  },
};

    s.textContent = w;
    s.dataset.say = w.replace(/[^A-Za-z']/g, '');
    container.append(s);
  });
}

function setScene(s) {
  if (s !== 'play') SIDES.forEach(side => { inviteUntil[side] = {}; });
  scene = s;
  document.body.dataset.scene = s;
  renderColumns();
}

function applyColors(left = S.colors.left, right = S.colors.right) {
  const r = document.documentElement.style;
  const L = colorById(left), R = colorById(right);
  const set = (p, c) => {
    if (c) { r.setProperty(p, c.main); r.setProperty(p + '-light', c.light); r.setProperty(p + '-dark', c.dark); }
    else { r.removeProperty(p); r.removeProperty(p + '-light'); r.removeProperty(p + '-dark'); }
  };
  set('--L', L); set('--R', R);
}

function fillArt(box, side, useDrawing) {
  const cfg = PET_ART[side];
  box.innerHTML = '';
  const photo = cfg.awake && !useDrawing;
  box.classList.toggle('photo', !!photo);
  box.classList.toggle('has-asleep', !!(photo && cfg.asleep));
  if (photo) {
    const add = (src, cls) => {
      const img = new Image();
      img.className = cls; img.alt = ''; img.draggable = false;
      img.onerror = () => {                          // file missing? use the drawing
        fillArt(box, side, true);
        if (pets[side] && box === pets[side].art) { renderMud(side); renderWear(side); tummyLook(side); }
      };
      img.src = src;
      box.append(img);
    };
    add(cfg.awake, 'img-awake');
    if (cfg.asleep) add(cfg.asleep, 'img-asleep');
  } else {
    box.append(document.getElementById(cfg.drawing).content.cloneNode(true));
  }
}

function buildScene() {
  buildRooms();
  // stars for night time
  const night = $('#night');
  $('#moon').innerHTML = ICONS.moonBig;
  for (let i = 0; i < 26; i++) {
    const s = el('div', 'star');
    s.style.left = rand(3, 97) + '%'; s.style.top = rand(3, 55) + '%';
    s.style.animationDelay = rand(-3, 0) + 's';
    night.append(s);
  }
  SIDES.forEach(side => {
    const half = $('#night-' + side);
    for (let i = 0; i < 9; i++) {
      const s = el('div', 'star');
      s.style.left = rand(side === 'left' ? 30 : 5, side === 'left' ? 95 : 70) + '%';
      s.style.top = rand(4, 50) + '%';
      s.style.animationDelay = rand(-3, 0) + 's';
      half.append(s);
    }
    sayableInto($('#name-' + side), SETTINGS.players[side].girl);
  });
  wordsInto($('#goodnight'), 'Goodnight!');
  $('#start-btn').innerHTML = ICONS.go;
  $('#go-btn').innerHTML = ICONS.go;

  SIDES.forEach(side => {
    const root = el('div', 'pet side-' + side);
    root.innerHTML = '<div class="lean"><div class="bounce"><div class="art"></div></div></div>' +
      '<div class="zzz"><span>z</span><span>z</span><span>Z</span></div><div class="tag"></div>' +
      '<div class="glitter">' + [[8, 20], [82, 14], [90, 52], [4, 58], [48, 2], [70, 84]].map(([x, y], i) =>
        `<i style="left:${x}%; top:${y}%; animation-delay:${-i * 0.3}s">${ICONS.star}</i>`).join('') + '</div>';
    world.append(root);
    const p = {
      side, root,
      lean: root.querySelector('.lean'), bounce: root.querySelector('.bounce'),
      art: root.querySelector('.art'), tag: root.querySelector('.tag'),
      x: 0, y: 0, asleep: false, token: 0, busyUntil: 0, moodTimer: 0, anims: [],
      wish: null, lastWish: null, wishUntil: 0, nextWishAt: now() + rand(6000, 14000),
    };
    pets[side] = p;
    fillArt(p.art, side);
    sayableInto(p.tag, SETTINGS.players[side].pet);
    onTap(p.lean, () => petTapped(side));
    setPos(p, HOME[side].x, HOME[side].y);
  });
}

/* ---------- where things are on screen ---------- */
const W = () => stage.clientWidth;
const H = () => stage.clientHeight;
const petSize = () => Math.min(W(), H()) * 0.33;
function setPos(p, x, y) {
  p.x = x; p.y = y;
  p.root.style.left = x + '%';
  p.root.style.bottom = y + '%';
}
/* A point on a pet: fx, fy go from 0 to 1 across the pet's picture (0,0 is top-left). */
function petPoint(p, fx, fy) {
  const s = petSize(), cx = p.x / 100 * W(), bottom = H() - p.y / 100 * H();
  return { x: cx + (fx - 0.5) * s, y: bottom - s + fy * s };
}
function movePet(side, x, y, ms) {
  const p = pets[side], x0 = p.x, y0 = p.y;
  p.root.classList.add('walking');
  return tween(ms, t => setPos(p, x0 + (x - x0) * t, y0 + (y - y0) * t))
    .then(() => p.root.classList.remove('walking'));
}

/* ---------- flying things (food, treats, hearts) ---------- */
function prop(svg, sizeVmin, x, y) {
  const outer = el('div', 'prop');
  const inner = el('div', '', svg);
  outer.append(inner);
  outer.style.width = outer.style.height = sizeVmin + 'vmin';
  outer.style.left = x + 'px'; outer.style.top = y + 'px';
  world.append(outer);
  return outer;
}
function floatHearts(p, n = 3, color = '#ff6f91') {
  for (let i = 0; i < n; i++) {
    const pt = petPoint(p, 0.5 + rand(-0.3, 0.3), 0.18 + rand(-0.05, 0.1));
    const h = prop(ICONS.heart, rand(4, 6), pt.x, pt.y);
    h.style.color = color; h.style.zIndex = 31;
    animate(h.firstChild, [
      { transform: 'translateY(0) scale(.3)', opacity: 0 },
      { transform: 'translateY(-3vmin) scale(1)', opacity: 1, offset: 0.2 },
      { transform: 'translateY(-17vmin) scale(.9)', opacity: 0 },
    ], { duration: 1500, delay: i * 140, easing: 'ease-out', fill: 'both' }).then(() => h.remove());
  }
}
function sparkles(x, y, n = 8, colors = ['#ffd23f', '#ff7eb6', '#5aa9ff', '#6cc551']) {
  for (let i = 0; i < n; i++) {
    const s = prop(ICONS.star, rand(2.5, 4.5), x, y);
    s.style.color = pick(colors); s.style.zIndex = 32;
    const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), d = rand(8, 15);
    animate(s.firstChild, [
      { transform: 'translate(0,0) scale(.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}vmin, ${Math.sin(a) * d}vmin) scale(1) rotate(160deg)`, opacity: 0 },
    ], { duration: 900, easing: 'ease-out', fill: 'both' }).then(() => s.remove());
  }
}
/* A speech bubble above a pet: "Thank you, Leah!" (each word can be tapped). */
function sayBubble(p, text, ms = 2800) {
  p.root.querySelectorAll('.say').forEach(b => b.remove());
  const b = el('div', 'say');
  wordsInto(b, text);
  p.root.append(b);
  p.root.classList.add('saying');
  clearTimeout(p.sayTimer);
  p.sayTimer = setTimeout(() => p.root.classList.remove('saying'), ms + 400);
  animate(b, [{ transform: 'translateX(-50%) scale(0)' }, { transform: 'translateX(-50%) scale(1.08)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 350, easing: 'ease-out' });
  setTimeout(() => {
    animate(b, [{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).then(() => b.remove());
  }, ms);
}

/* =====================================================================
   9. THE PETS: eat, play, sleep, and being tapped
   ===================================================================== */
/* Start a new action on a pet. Cancels whatever it was doing.
   Returns a function that says whether this action is still the current one. */
function begin(p, ms = 1600) {
  const t = ++p.token;
  p.anims.forEach(a => a.cancel && a.cancel());
  p.anims = [];
  p.root.querySelectorAll('.prop-own').forEach(e => e.remove());
  document.querySelectorAll('.prop[data-owner="' + p.side + '"]').forEach(e => e.remove());
  clearTimeout(p.moodTimer);
  p.root.classList.remove('chomp', 'happy');
  p.busyUntil = now() + ms;
  return () => t === p.token;
}
function petAnim(p, frames, opts) {
  const done = animate(p.bounce, frames, opts);
  if (done.anim) p.anims.push(done.anim);
  return done;
}
function mood(p, cls, ms) {
  p.root.classList.add(cls);
  clearTimeout(p.moodTimer);
  p.moodTimer = setTimeout(() => p.root.classList.remove(cls), ms);
}
const canAct = () => scene === 'play';

async function feed(side, food) {
  if (!canAct()) return;
  const p = pets[side];
  if (isFull(side)) { sayFull(p); return; }
  const alive = begin(p, 1900);
  grantWish(p, 'food:' + food);
  const pt = petPoint(p, 0.5, 0.72);
  const f = prop(ICONS[food], 12, pt.x, pt.y);
  f.dataset.owner = side;
  Sound.play('eat');
  setTummy(side, tummy(side) + 0.3);
  await animate(f.firstChild, [{ transform: 'scale(0) translateY(-6vmin)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out', fill: 'both' });
  for (let i = 0; i < 3; i++) {
    if (!alive()) return;
    p.root.classList.add('chomp');
    petAnim(p, [{ transform: 'scale(1,1)' }, { transform: 'scale(1.05,.94)' }, { transform: 'scale(1,1)' }], { duration: 200 });
    await wait(130);
    f.firstChild.style.transform = `scale(${0.75 - i * 0.25})`;
    p.root.classList.remove('chomp');
    await wait(90);
  }
  if (!alive()) return;
  f.remove();
  mood(p, 'happy', 1300);
  floatHearts(p, 3);
  petAnim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-7%)' }, { transform: 'translateY(0)' }], { duration: 380, easing: 'ease-out' });
}

const lastPlay = { left: -1e9, right: -1e9 };
async function playBall(side) {
  if (!canAct()) return;
  const p = pets[side], o = other(side);
  if (p.asleep) wakePet(side, true);
  grantWish(p, 'play');
  // Both girls tapped Play close together? Chase time!
  const t = now();
  lastPlay[side] = t;
  if (t - lastPlay[o] < SETTINGS.togetherWindowMs && !pets[o].asleep) {
    lastPlay.left = lastPlay.right = -1e9;
    startChase();
    return;
  }
  if (!pets[o].asleep) invite(o, 'play', SETTINGS.togetherWindowMs);
  const alive = begin(p, 1700);
  mood(p, 'happy', 1600);
  Sound.play('play');
  const base = petPoint(p, 0.5, 0.95);
  const ball = prop(ICONS.ball, 9, base.x + (side === 'left' ? 1 : -1) * petSize() * 0.38, base.y - petSize() * 0.06);
  ball.dataset.owner = side;
  animate(ball.firstChild, [
    { transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-22vmin) rotate(180deg)', offset: 0.3 },
    { transform: 'translateY(0) rotate(360deg)', offset: 0.55 }, { transform: 'translateY(-10vmin) rotate(480deg)', offset: 0.75 },
    { transform: 'translateY(0) rotate(560deg)' },
  ], { duration: 1500, easing: 'ease-in-out' }).then(() => ball.remove());
  await petAnim(p, [
    { transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-16%) rotate(-8deg)', offset: 0.25 },
    { transform: 'translateY(0) rotate(0)', offset: 0.5 }, { transform: 'translateY(-11%) rotate(8deg)', offset: 0.75 },
    { transform: 'translateY(0) rotate(0)' },
  ], { duration: 1400, easing: 'ease-in-out' });
  if (!alive()) return;
  p.root.classList.add('wag');
  setTimeout(() => p.root.classList.remove('wag'), 1600);
}

function goSleep(side) {
  if (!canAct()) return;
  const p = pets[side];
  begin(p, 800);
  if (!grantWish(p, 'sleep') && p.wish) clearWish(p, true);
  p.asleep = true; S.pets[side].asleep = true; save();
  p.root.classList.add('asleep');
  $('#night-' + side).classList.add('on');
  Sound.play('sleep');
  renderColumn(side);
  if (!pets[other(side)].asleep) invite(other(side), 'sleep', 5000);
  checkBothAsleep();
}
function wakePet(side, quiet) {
  const p = pets[side];
  p.asleep = false; S.pets[side].asleep = false; save();
  p.root.classList.remove('asleep');
  $('#night-' + side).classList.remove('on');
  if (!quiet) {
    begin(p, 900);
    Sound.play('wake');
    mood(p, 'happy', 1200);
    petAnim(p, [{ transform: 'scale(1,1)' }, { transform: 'scale(.94,1.1)' }, { transform: 'scale(1,1)' }], { duration: 700, easing: 'ease-out' });
  }
  renderColumn(side);
}

function petTapped(side) {
  const p = pets[side];
  if (scene === 'night') { goodMorning(); return; }
  if (!canAct()) return;
  if (S.room === 'backyard') { grantWish(p, 'hug'); bounce(side); return; }          // tap to bounce
  if (bath[side] && bath[side].step === 'scrub') { scrubPet(side); return; }       // tap to scrub
  if (bath[side]) return;
  if (p.asleep) { wakePet(side); return; }
  begin(p, 1000);
  grantWish(p, 'hug');
  mood(p, 'happy', 1100);
  Sound.play('giggle');
  floatHearts(p, 2);
  p.root.classList.add('wag'); setTimeout(() => p.root.classList.remove('wag'), 1600);
  petAnim(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 650 });
}

/* =====================================================================
   10. TOGETHER MOMENTS (in the shared middle)
   ===================================================================== */
// Some together moments can happen very quickly over and over; count those only now and then.
const COOLDOWN = { treat: 15000, trampoline: 20000 };
const lastMoment = {};
function togetherMoment(type) {
  if (COOLDOWN[type]) {
    if (now() - (lastMoment[type] || -1e9) < COOLDOWN[type]) return;
    lastMoment[type] = now();
  }
  S.together++;
  logDay(type);
  addHeart();
  checkUnlocks();
  save();
  setTimeout(runQueue, 1600);
}
/* Remember what the pets did together today (for the memory book). */
function logDay(type) {
  const key = todayKey();
  const day = S.book[key] || (S.book[key] = []);
  if (!day.includes(type)) day.push(type);
  const keys = Object.keys(S.book).sort();
  while (keys.length > 120) delete S.book[keys.shift()];
}

/* --- Treat: toss a treat to your sister's pet --- */
const treatFlying = { left: false, right: false };
async function giveTreat(side, btn) {
  if (!canAct()) return;
  const o = other(side), pf = pets[side], pt = pets[o];
  if (pt.asleep || treatFlying[side]) { nudge(btn); return; }
  if (isFull(o)) { nudge(btn); sayFull(pt); return; }
  treatFlying[side] = true;
  begin(pf, 700);
  petAnim(pf, [{ transform: 'translateY(0)' }, { transform: 'translateY(-8%) rotate(' + (side === 'left' ? 6 : -6) + 'deg)' }, { transform: 'translateY(0)' }], { duration: 450 });
  Sound.play('toss');
  const a = petPoint(pf, 0.5, 0.5);
  const tr = prop(ICONS.treat, 9, a.x, a.y);
  tr.style.zIndex = 33;
  const peak = H() * 0.3;
  await tween(950, t => {
    const b = petPoint(pt, 0.5, 0.55);
    const x = a.x + (b.x - a.x) * t;
    const y = a.y + (b.y - a.y) * t - peak * 4 * t * (1 - t);
    tr.style.left = x + 'px'; tr.style.top = y + 'px';
    tr.firstChild.style.transform = `rotate(${t * (side === 'left' ? 540 : -540)}deg)`;
  }, ease.linear);
  treatFlying[side] = false;
  if (pt.asleep || !canAct()) { // fell asleep while it was flying: the treat waits by her bed
    animate(tr, [{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' }).then(() => tr.remove());
    return;
  }
  const alive = begin(pt, 1600);
  Sound.play('catch');
  tr.remove();
  setTummy(o, tummy(o) + 0.1);
  pt.root.classList.add('chomp');
  await petAnim(pt, [{ transform: 'translateY(0)' }, { transform: 'translateY(-10%)' }, { transform: 'translateY(0) scale(1.04,.96)' }, { transform: 'none' }], { duration: 500, easing: 'ease-out' });
  if (!alive()) return;
  pt.root.classList.remove('chomp');
  mood(pt, 'happy', 2000);
  floatHearts(pt, 4);
  Sound.play('thanks');
  sayBubble(pt, 'Thank you, ' + SETTINGS.players[side].girl + '!');
  togetherMoment('treat');
}

/* --- Chase: both tapped Play at nearly the same time --- */
async function startChase() {
  setScene('chase');
  SIDES.forEach(s => { begin(pets[s], 7000); pets[s].root.classList.add('happy', 'running'); });
  Sound.play('chase');
  const cx = 50, cy = 15, rx = 14, ry = 5;
  await Promise.all([movePet('left', cx - rx, cy, 500), movePet('right', cx + rx, cy, 500)]);
  SIDES.forEach(s => pets[s].root.classList.add('running'));
  const place = (side, ang) => {
    const p = pets[side];
    setPos(p, cx + rx * Math.cos(ang), cy + ry * Math.sin(ang));
    const depth = Math.sin(ang);                       // 1 = far away, -1 = close
    const dir = -Math.sin(ang) >= 0 ? 1 : -1;          // moving right or left
    p.root.style.zIndex = depth > 0 ? 9 : 11;
    p.lean.style.transform = `rotate(${dir * 9}deg) scale(${0.9 - depth * 0.08})`;
  };
  await tween(4800, t => {
    const a = t * Math.PI * 4;                         // two laps
    place('left', Math.PI + a);
    place('right', a);
  }, ease.linear);
  SIDES.forEach(s => { pets[s].lean.style.transform = ''; pets[s].root.style.zIndex = ''; });
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 700), movePet('right', HOME.right.x, HOME.right.y, 700)]);
  SIDES.forEach(s => { pets[s].root.classList.remove('running'); floatHearts(pets[s], 3); mood(pets[s], 'happy', 1500); });
  togetherMoment('chase');
  endScene();
}

/* --- Goodnight: both pets asleep --- */
let bothAsleepTimer = 0;
function checkBothAsleep() {
  clearTimeout(bothAsleepTimer);
  if (!(pets.left.asleep && pets.right.asleep)) return;
  bothAsleepTimer = setTimeout(() => {
    if (pets.left.asleep && pets.right.asleep && scene === 'play') goodnight();
  }, 1400);
}
async function goodnight() {
  setScene('goodnight');
  SIDES.forEach(s => { begin(pets[s], 5000); $('#night-' + s).classList.remove('on'); });
  $('#night').classList.add('on');
  Sound.play('lullaby');
  await wait(700);
  await Promise.all([movePet('left', CUDDLE.left.x, CUDDLE.left.y, 2200), movePet('right', CUDDLE.right.x, CUDDLE.right.y, 2200)]);
  pets.left.lean.style.transform = 'rotate(7deg)';
  pets.right.lean.style.transform = 'rotate(-7deg)';
  $('#goodnight').classList.add('on');
  SIDES.forEach(s => floatHearts(pets[s], 2, '#ffd6e4'));
  togetherMoment('sleep');
  await wait(1200);
  if (scene === 'goodnight') setScene('night');
}
/* Put the pets back the way they were last time (asleep or awake). */
/* The game always opens in the playroom, with both pets awake. */
function restorePets() {
  SIDES.forEach(s => {
    const p = pets[s];
    p.asleep = false;
    p.root.classList.remove('asleep');
    p.root.style.opacity = '';
    p.lean.style.transform = '';
    $('#night-' + s).classList.remove('on');
    setPos(p, HOME[s].x, HOME[s].y);
    renderMud(s); renderWear(s); renderFluffy(s); renderToys(s); renderTrickList(s);
  });
  $('#night').classList.remove('on');
  $('#goodnight').classList.remove('on');
  showRoom('playroom');
}
async function goodMorning() {
  if (scene !== 'night') return;
  setScene('morning');
  Sound.stopMusic();
  Sound.play('morning');
  $('#goodnight').classList.remove('on');
  $('#night').classList.remove('on');
  SIDES.forEach(s => {
    const p = pets[s];
    p.asleep = false; S.pets[s].asleep = false;
    p.root.classList.remove('asleep');
    p.lean.style.transform = '';
    mood(p, 'happy', 2600);
  });
  save();
  await wait(500);
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 1200), movePet('right', HOME.right.x, HOME.right.y, 1200)]);
  SIDES.forEach(s => floatHearts(pets[s], 2));
  endScene();
}

function endScene() {
  setScene('play');
  setTimeout(runQueue, 500);
}

/* =====================================================================
   11. NEW THINGS APPEAR, ONE AT A TIME
   ===================================================================== */
const queue = [];
function checkUnlocks() {
  for (const [key, at] of Object.entries(SETTINGS.unlockAt)) {
    if (S.together >= at && !S.unlocked[key] && !queue.includes(key)) queue.push(key);
  }
}
let queueBusy = false;
async function runQueue() {
  if (scene !== 'play' || queueBusy) return;
  // a full jar brings presents, which open in the playroom
  if (S.unlocked.jar && S.jar >= SETTINGS.jarSize && S.room === 'playroom') { startPresents(); return; }
  if (!queue.length) return;
  queueBusy = true;
  await reveal(queue.shift());
  queueBusy = false;
  setTimeout(runQueue, 1500);
}
const newUntil = {};
// Where each new button lives, so its door can sparkle if the girls are in another room.
const UNLOCK_BUTTON = { treat: 'treat', ball: 'ballgame', seesaw: 'seesawgame', highfive: 'fivegame', book: 'book' };
async function reveal(key) {
  S.unlocked[key] = true; save();
  Sound.play('unlock');
  if (UNLOCK_BUTTON[key]) {
    const act = UNLOCK_BUTTON[key], room = roomOfAct(act);
    if (room === S.room) { newUntil[act] = Date.now() + 6000; renderColumns(); }
    else { S.doorNew[room] = true; save(); renderDoors(); }
  } else if (key === 'jar') {
    renderJar();
    const jar = $('#jar');
    jar.classList.add('pop');
    setTimeout(() => jar.classList.remove('pop'), 1000);
    await wait(1100);
    await addHeart();      // the together moment that brought the jar
  } else if (key === 'bubbles') {
    pets.left.nextWishAt = now() + 2500;
    pets.right.nextWishAt = now() + 9500;
  }
}

/* =====================================================================
   12. THE FRIENDSHIP JAR (one jar, shared by both girls)
   ===================================================================== */
function jarSlots() {
  const n = SETTINGS.jarSize, xs = [30, 50, 70], out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / 3), inRow = Math.min(3, n - row * 3), col = i % 3;
    const x = inRow === 1 ? 50 : inRow === 2 ? [40, 60][col] : xs[col];
    out.push([x, 104 - row * 17]);
  }
  return out;
}
function renderJar() {
  const jar = $('#jar');
  jar.classList.toggle('show', !!S.unlocked.jar);
  jar.classList.toggle('full', S.jar >= SETTINGS.jarSize);

/* Throw something in an arc. b may be a function so it can follow a moving target. */
function arc(elm, a, b, ms, peak, spin = 0) {
  return tween(ms, t => {
    const end = typeof b === 'function' ? b() : b;
    elm.style.left = a.x + (end.x - a.x) * t + 'px';
    elm.style.top = a.y + (end.y - a.y) * t - peak * 4 * t * (1 - t) + 'px';
    if (spin) elm.firstChild.style.transform = `rotate(${t * spin}deg)`;
  }, ease.linear);
}

const GAME_SETUP = {
  async ball(g) {

const GAME_PRESS = {
  async ball(g, side) {
    if (side !== g.turn) { hopPet(side); return; }
    g.busy = true;
    const from = pets[side], to = pets[other(side)];
    Sound.play('throw');
    petAnim(from, [{ transform: 'translateY(0)' }, { transform: 'translateY(-6%) rotate(' + (side === 'left' ? 8 : -8) + 'deg)' }, { transform: 'translateY(0)' }], { duration: 400 });
    await arc(g.ball, petPoint(from, 0.5, 0.78), () => petPoint(to, 0.5, 0.6), 950, H() * 0.32, side === 'left' ? 400 : -400);

    if (side !== downSide) { hopPet(side); return; }
    g.busy = true;

    mood(pets[side], 'happy', 1300);

    await tween(650, t => { g.tilt = from + (to - from) * t; layoutSeesaw(g); }, ease.inOut);
    hopPet(other(side));
    g.turn = other(side);
    g.busy = false;

  },
  async highfive(g, side) {
    const t = now(), o = other(side);
    g.raised[side] = t;
    Sound.play('pawUp');
    mood(pets[side], 'happy', 1200);
    const paw = g.paws[side];
    paw.style.opacity = 1;
    const down = pawSpot(side, false), up = pawSpot(side, true);
    if (t - g.raised[o] < 1200) {
      // both pressed: HIGH FIVE!
      g.busy = true;
      g.raised = { left: -1e9, right: -1e9 };
      const meet = { x: (pawSpot('left', true).x + pawSpot('right', true).x) / 2, y: up.y - H() * 0.03 };

      SIDES.forEach(s => { g.paws[s].style.opacity = 0; });

    }
    // only one paw up so far: wait for the sister
    await arc(paw, down, up, 180, 0);

/* seesaw math: tilt 1 = left side down, -1 = right side down */
function seesawGeom() { return { cx: W() / 2, yp: H() * 0.16, hl: Math.min(W() * 0.17, H() * 0.3) }; }
function seesawEnds(tilt) {
  const { cx, yp, hl } = seesawGeom(), th = tilt * 12 * Math.PI / 180, lift = H() * 0.012;
  return {
    left:  { x: (cx - hl * Math.cos(th)) / W() * 100, y: (yp - hl * Math.sin(th) + lift) / H() * 100 },
    right: { x: (cx + hl * Math.cos(th)) / W() * 100, y: (yp + hl * Math.sin(th) + lift) / H() * 100 },
  };
}
function layoutSeesaw(g) {
  const { cx, yp, hl } = seesawGeom(), len = 2 * hl + petSize() * 0.4, thick = Math.min(W(), H()) * 0.028;
  Object.assign(g.plank.style, { left: cx - len / 2 + 'px', width: len + 'px', bottom: yp - thick / 2 + 'px', transform: `rotate(${-g.tilt * 12}deg)` });
  const bh = yp - H() * 0.05, bw = bh * 1.2;
  Object.assign(g.base.style, { left: cx - bw / 2 + 'px', width: bw + 'px', bottom: H() * 0.05 + 'px', height: bh + 'px' });
  const ends = seesawEnds(g.tilt);
  SIDES.forEach(s => setPos(pets[s], ends[s].x, ends[s].y));
}

};
function pawSvg(side) {

  return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="56" rx="32" ry="30" fill="${c.fur}" stroke="${c.line}" stroke-width="5"/><ellipse cx="50" cy="66" rx="15" ry="12" fill="${c.pad}"/><circle cx="29" cy="44" r="7" fill="${c.pad}"/><circle cx="43" cy="35" r="7" fill="${c.pad}"/><circle cx="57" cy="35" r="7" fill="${c.pad}"/><circle cx="71" cy="44" r="7" fill="${c.pad}"/></svg>`;
}

/* =====================================================================
   14. THOUGHT BUBBLES: a pet asks for something (picture + one word)
   ===================================================================== */
const WISHES = {
  apple:  { icon: 'apple',      act: 'food:apple' },
  fish:   { icon: 'fish',       act: 'food:fish' },
  bone:   { icon: 'bone',       act: 'food:bone' },
  ball:   { icon: 'ball',       act: 'play' },
  nap:    { icon: 'nap',        act: 'sleep' },
  hug:    { icon: 'hug',        act: 'hug' },     // tap the pet
  bath:   { icon: 'roomBath',   act: 'bath' },
  brush:  { icon: 'brush',      act: 'brush' },
  bounce: { icon: 'trampoline', act: 'bounce' },
};
function wishChoices(side) {
  const p = pets[side];
  if (isHungry(side)) return ['apple', 'fish', 'bone'].filter(w => w !== p.lastWish);   // a hungry pet asks for food
  let list = SETTINGS.wishes.flatMap(w => (w === 'tricks' ? TRICKS.filter(t => knows(side, t.key)).map(t => t.word) : [w]));
  list = list.filter(w => WISHES[w] && w !== p.lastWish);
  if (isFull(side)) list = list.filter(w => !WISHES[w].act.startsWith('food:'));
  if (S.pets[side].mud >= 1 && list.includes('bath')) list.push('bath', 'bath');          // muddy pets think about baths
  return list;
}
function wishTick() {
  if (!S.unlocked.bubbles || scene !== 'play' || $('#book').classList.contains('show')) return;
  SIDES.forEach(side => {
    const p = pets[side];
    if (p.wish && now() > p.wishUntil) { clearWish(p); return; }       // no wish lasts forever; no one is sad
    if (p.wish || p.asleep || bath[side] || now() < p.nextWishAt || now() < p.busyUntil) return;
    const choices = wishChoices(side);
    if (!choices.length) return;
    showWish(p, pick(choices));
    const o = pets[other(side)];
    o.nextWishAt = Math.max(o.nextWishAt, now() + 7000);               // one at a time is easier
  });
}
function showWish(p, word) {
  clearWish(p, true);
  p.wish = word; p.lastWish = word; p.wishUntil = now() + 25000;
  const b = el('div', 'thought word', `<div class="pic">${ICONS[WISHES[word].icon]}</div><div class="say-word">${word}</div>`);
  b.dataset.say = word;
  p.root.append(b);
  animate(b, [{ transform: 'translateX(-50%) scale(0)' }, { transform: 'translateX(-50%) scale(1.1)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 400, easing: 'ease-out' });
  Sound.play('bubble');
}
function clearWish(p, quick) {
  const b = p.root.querySelector('.thought');
  p.wish = null;
  p.nextWishAt = now() + (isHungry(p.side) ? rand(8000, 14000) : rand(18000, 32000));
  if (!b) return;
  if (quick) { b.remove(); return; }
  animate(b, [{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).then(() => b.remove());
}
/* Did this action give the pet what it was wishing for? */
function grantWish(p, act) {
  if (!p.wish || WISHES[p.wish].act !== act) return false;
  const b = p.root.querySelector('.thought');
  if (b) {
    const r = b.getBoundingClientRect();
    sparkles(r.left + r.width / 2, r.top + r.height / 2, 12);
  }
  clearWish(p, true);
  floatHearts(p, 4);
  setTimeout(() => Sound.play('wish'), 450);
  return true;
}

   15. THE MEMORY BOOK: one short sentence a day, shared by both girls
   ===================================================================== */
// Most special first: the book uses the first one that happened that day.
const BOOK_LINES = {
  presents:   { line: 'gave each other presents.',    icon: 'gift' },
  balloons:   { line: 'had a balloon party.',          icon: 'balloon' },
  dance:      { line: 'had a dance party.',            icon: 'note' },
  picnic:     { line: 'had a picnic.',                 icon: 'basket' },
  rainbow:    { line: 'slid down a rainbow.',          icon: 'rainbow' },
  trampoline: { line: 'bounced on the trampoline.',    icon: 'trampoline' },
  highfive:   { line: 'did high fives in the playroom.', icon: 'hand' },
  seesaw:     { line: 'rode the seesaw in the backyard.', icon: 'seesaw' },
  ball:       { line: 'played catch in the backyard.', icon: 'catch' },
  sleep:      { line: 'fell asleep in the bedroom.',   icon: 'moon' },
  chase:      { line: 'played chase in the playroom.', icon: 'ball' },
  treat:      { line: 'shared treats in the kitchen.', icon: 'treat' },
};
let bookPage = 0;
const bookDays = () => Object.keys(S.book).filter(k => S.book[k].length).sort();
function bookSentence(types) {
  const both = SETTINGS.players.left.pet + ' and ' + SETTINGS.players.right.pet;
  const best = Object.keys(BOOK_LINES).find(k => types.includes(k));
  return both + ' ' + (best ? BOOK_LINES[best].line : 'are best friends.');
}
function dayWord(key) {
  if (!key) return 'Today';
  const [y, m, d] = key.split('-').map(Number), day = new Date(y, m - 1, d);
  const diff = Math.round((new Date(new Date().toDateString()) - day) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][day.getDay()];
}
function openBook() {
  if (scene !== 'play') return;
  const days = bookDays();
  bookPage = Math.max(0, days.length - 1);       // open on the newest page
  $('#book').classList.add('show');
  Sound.play('page');
  renderBook();
}
function closeBook() { $('#book').classList.remove('show'); }
function turnPage(dir) {
  const days = bookDays(), next = bookPage + dir;
  if (next < 0 || next >= days.length) return;
  bookPage = next;
  Sound.play('page');
  renderBook();
  animate($('#book .book'), [{ transform: `translateX(${dir * 3}vmin)`, opacity: .5 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'ease-out' });
}
function renderBook() {
  const days = bookDays(), key = days[bookPage], types = key ? S.book[key] : [];
  const sentence = bookSentence(types);
  const box = $('#book .book');
  box.innerHTML = `
    <div class="page lp"><div class="book-pets"><div class="art happy"></div><div class="art happy"></div></div><div class="book-pics"></div></div>
    <div class="page rp"><div class="book-day"></div><div class="book-line"></div><div class="say-all word">${ICONS.speaker}</div></div>
    <div class="book-btn book-close">${ICONS.close}</div>
    <div class="book-btn book-prev ${bookPage > 0 ? '' : 'off'}">${ICONS.prev}</div>
    <div class="book-btn book-next ${bookPage < days.length - 1 ? '' : 'off'}">${ICONS.next}</div>`;
  const petBoxes = box.querySelectorAll('.book-pets > div');
  fillArt(petBoxes[0], 'left'); fillArt(petBoxes[1], 'right');
  const pics = box.querySelector('.book-pics');
  Object.keys(BOOK_LINES).filter(k => types.includes(k)).forEach(k => pics.append(el('div', '', ICONS[BOOK_LINES[k].icon])));
  sayableInto(box.querySelector('.book-day'), dayWord(key));
  wordsInto(box.querySelector('.book-line'), sentence);
  box.querySelector('.say-all').dataset.say = sentence;
  onPress(box.querySelector('.book-close'), closeBook);
  onPress(box.querySelector('.book-prev'), () => turnPage(-1));
  onPress(box.querySelector('.book-next'), () => turnPage(1));
}

/* =====================================================================
   16. THE HOUSE: rooms and doors
   Both pets are always in the same room. To move, both girls tap the
   same door (each taps her own half, with her pet's face on it).
   ===================================================================== */
const ROOMS = {
  playroom: { word: 'playroom', icon: 'roomPlay',    door: '#ffd98a', acts: ['play', 'tricks', 'fivegame', 'dress'] },
  kitchen:  { word: 'kitchen',  icon: 'roomKitchen', door: '#9fd8f0', acts: ['apple', 'fish', 'bone', 'treat'] },
  bathroom: { word: 'bathroom', icon: 'roomBath',    door: '#9fe3cf', acts: ['bath', 'brush'] },

const ROOM_ORDER = Object.keys(ROOMS);
// Buttons that only appear once their "new thing" has unlocked: button -> unlock name

const roomOfAct = act => ROOM_ORDER.find(r => ROOMS[r].acts.includes(act));

function roomMarkup(room) {

    ${[10, 36, 64, 90].map((x, i) => `<div class="bub" style="left:${x}%; animation-delay:${-i * 3.5}s; animation-duration:${12 + i * 2}s"></div>`).join('')}`;

function buildRooms() {

function showRoom(room) {

  SIDES.forEach(s => tummyLook(s));

/* ---------- doors ---------- */
const votes = { left: null, right: null };
function faceDrawing(side) {
  const svg = document.getElementById(PET_ART[side].drawing).content.querySelector('svg').cloneNode(true);
  svg.setAttribute('viewBox', PET_ART[side].face);
  return svg;
}
function fillFace(box, side) {
  box.innerHTML = '';
  if (PET_ART[side].awake) {
    const img = new Image();
    img.alt = ''; img.draggable = false;
    img.onerror = () => { box.innerHTML = ''; box.append(faceDrawing(side)); };
    img.src = PET_ART[side].awake;
    box.append(img);
  } else {
    box.append(faceDrawing(side));
  }
}
function renderDoors() {
  const box = $('#doors');
  box.innerHTML = '';
  const jarFull = S.unlocked.jar && S.jar >= SETTINGS.jarSize;
  ROOM_ORDER.forEach(room => {
    const d = el('div', 'door' + (room === S.room ? ' here' : ''),
      `<div class="door-ico">${ICONS[ROOMS[room].icon]}</div>
       <div class="door-half l"><div class="door-face"></div></div><div class="door-half r"><div class="door-face"></div></div>`);
    d.dataset.room = room;
    d.style.setProperty('--door', ROOMS[room].door);
    if (room !== S.room) {
      const badge = room === 'playroom' && jarFull ? ICONS.gift : S.doorNew[room] ? ICONS.star : '';
      if (badge) d.append(el('div', 'badge', badge));
    }
    fillFace(d.querySelector('.l .door-face'), 'left');
    fillFace(d.querySelector('.r .door-face'), 'right');
    onPress(d.querySelector('.door-half.l'), () => tapDoor('left', room, d));
    onPress(d.querySelector('.door-half.r'), () => tapDoor('right', room, d));
    box.append(d);
  });
  showVotes();
}
function tapDoor(side, room, door) {
  if (scene !== 'play') return;
  if (room === S.room) { nudge(door); return; }
  const t = now(), o = votes[other(side)];
  votes[side] = { room, t };
  if (o && o.room === room && t - o.t < SETTINGS.doorWindowMs) {
    votes.left = votes.right = null;
    goToRoom(room);
    return;
  }
  Sound.play('knock');
  showVotes();
  setTimeout(showVotes, SETTINGS.doorWindowMs + 60);
}
/* The door glows; the sister's pet face blinks to invite her. */
function showVotes() {
  const t = now();
  document.querySelectorAll('#doors .door').forEach(d => SIDES.forEach(s => {
    const v = votes[s];
    d.classList.toggle('vote-' + s, !!(v && v.room === d.dataset.room && t - v.t < SETTINGS.doorWindowMs));
  }));
}
async function fadePets(show) {
  await Promise.all(SIDES.map(s => {
    const r = pets[s].root;
    const frames = [{ opacity: 0, transform: 'translateX(-50%) scale(.7)' }, { opacity: 1, transform: 'translateX(-50%) scale(1)' }];
    const done = animate(r, show ? frames : frames.slice().reverse(), { duration: 280, fill: 'forwards' });
    return done.then(() => { r.style.opacity = show ? '' : '0'; if (done.anim) done.anim.cancel(); });
  }));
}
async function goToRoom(room) {
  setScene('moving');
  Sound.play('door');
  closeSideModes();
  SIDES.forEach(s => {
    const p = pets[s];
    begin(p, 4000);
    if (p.asleep) wakePet(s, true);
    p.root.querySelectorAll('.say').forEach(b => b.remove());
  });
  await Promise.all([movePet('left', 45, 12, 600), movePet('right', 55, 12, 600)]);
  await fadePets(false);
  showRoom(room);
  save();
  await wait(380);
  await fadePets(true);
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 650), movePet('right', HOME.right.x, HOME.right.y, 650)]);
  SIDES.forEach(s => { pets[s].busyUntil = 0; });
  endScene();
  if (!S.seen[room]) firstVisitHint(room);
  else if (S.doorNew[room]) {
    delete S.doorNew[room]; save();
    ROOMS[room].acts.forEach(a => { if (LOCKED_BY[a]) newUntil[a] = Date.now() + 6000; });
    renderColumns(); renderDoors();
  }
}
/* A gentle hint the first time a room is visited: its name and its buttons glow. */
function firstVisitHint(room) {
  S.seen[room] = true;
  delete S.doorNew[room];
  save();
  const h = $('#hint');
  h.innerHTML = `<div class="hint-ico">${ICONS[ROOMS[room].icon]}</div><div class="hint-word"></div>`;
  sayableInto(h.querySelector('.hint-word'), ROOMS[room].word);
  h.classList.add('show');
  clearTimeout(h.timer);
  h.timer = setTimeout(() => h.classList.remove('show'), 4000);
  Sound.play('unlock');
  ROOMS[room].acts.forEach(a => { newUntil[a] = Date.now() + 6000; });
  renderColumns();
  if (room === 'playroom') {
    const d = $('#doors');
    d.classList.add('hint');
    setTimeout(() => d.classList.remove('hint'), 4600);
  }
}
/* Leaving a room (or changing colors) tidies away anything half-done. */
const sideMode = { left: null, right: null };
const trickTouched = { left: 0, right: 0 };
function closeSideModes() {
  SIDES.forEach(s => { sideMode[s] = null; endBath(s); });
}

/* =====================================================================
   17. THE KITCHEN: tummies
   A tummy fills as the pet eats and empties slowly over real time.
   It's drawn as a rounder tummy (only in the kitchen), never a number.
   ===================================================================== */
const HOUR = 3600000;
function tummy(side) {
  const t = S.pets[side];
  return Math.max(0, Math.min(1, t.tummy - (Date.now() - t.tummyAt) / (SETTINGS.tummyHours * HOUR)));
}
function setTummy(side, v) {
  const t = S.pets[side];
  t.tummy = Math.max(0, Math.min(1, v));
  t.tummyAt = Date.now();
  save();
  tummyLook(side);
}
const isFull = side => tummy(side) >= 0.9;
const isHungry = side => tummy(side) < 0.2;
function tummyLook(side) {
  const body = pets[side] && pets[side].art.querySelector('.pet-svg .body');
  if (!body) return;
  const t = S.room === 'kitchen' ? tummy(side) : 0;
  body.style.transform = t > 0.02 ? `scale(${1 + 0.17 * t}, ${1 + 0.05 * t})` : '';
}
function sayFull(p) {
  begin(p, 1400);
  Sound.play('full');
  sayBubble(p, "No thanks, I'm full!");
  petAnim(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-5deg)' }, { transform: 'rotate(5deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 700 });
}

/* =====================================================================
   18. THE BATHROOM: bath (fill, bubbles, duck, scrub, dry) and brushing
   ===================================================================== */
const bath = { left: null, right: null };
const bathAct = side => (!bath[side] ? 'bath' : bath[side].step === 'dry' ? 'dry' : 'scrub');
function bathStep(side) {
  const b = bath[side];
  if (!b) return startBath(side);
  if (b.busy) return;
  if (b.step === 'scrub') return scrubPet(side);
  if (b.step === 'dry') return dryPet(side);
}
async function startBath(side) {
  const p = pets[side];
  begin(p, 2600);
  const b = bath[side] = { step: 'scrub', scrubs: 0, busy: true, bubbles: [] };
  const s = petSize(), base = petPoint(p, 0.5, 1), top = base.y - s * 0.4;
  b.tub = el('div', 'tub side-' + side, ICONS.tub);
  Object.assign(b.tub.style, { left: base.x + 'px', top: top + 'px', width: s * 1.2 + 'px', height: s * 0.5 + 'px' });
  world.append(b.tub);
  Sound.play('water');
  const water = b.tub.querySelector('.water');
  water.style.transform = 'scaleY(0)';
  await animate(b.tub, [{ transform: 'translateX(-50%) translateY(40%)', opacity: 0 }, { transform: 'translateX(-50%) translateY(0)', opacity: 1 }], { duration: 450, easing: 'ease-out' });
  if (bath[side] !== b) return;
  await tween(900, t => { water.style.transform = `scaleY(${t})`; }, ease.out);
  if (bath[side] !== b) return;
  for (let i = 0; i < 9; i++) {
    const f = el('div', 'foamball');
    const sz = rand(3.5, 6.5);
    Object.assign(f.style, { left: base.x + (i / 8 - 0.5) * s * 1.05 + rand(-6, 6) + 'px', top: top + s * rand(0.0, 0.05) + 'px', width: sz + 'vmin', height: sz + 'vmin' });
    world.append(f);
    b.bubbles.push(f);
    animate(f, [{ transform: 'translate(-50%,-50%) scale(0)' }, { transform: 'translate(-50%,-50%) scale(1.15)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 300, delay: i * 70, fill: 'both' });
    setTimeout(() => Sound.play('pop'), i * 70);
  }
  b.duck = el('div', 'duck', ICONS.duck);
  Object.assign(b.duck.style, { left: base.x + s * (side === 'left' ? 0.42 : -0.42) + 'px', top: top - s * 0.02 + 'px' });
  if (side === 'right') b.duck.firstChild.style.transform = 'scaleX(-1)';
  world.append(b.duck);
  onTap(b.duck, () => {
    Sound.play('squeak');
    animate(b.duck.firstChild, [{ transform: b.duck.firstChild.style.transform + ' translateY(0)' }, { transform: b.duck.firstChild.style.transform + ' translateY(-40%)' }, { transform: b.duck.firstChild.style.transform + ' translateY(0)' }], { duration: 400, easing: 'ease-out' });
  });
  b.busy = false;
  mood(p, 'happy', 1500);
  renderColumn(side);
}
function addFoam(p) {
  const f = el('div', 'foam');
  const sz = rand(10, 16);
  Object.assign(f.style, { left: rand(22, 68) + '%', top: rand(18, 62) + '%', width: sz + '%', height: sz + '%' });
  p.art.append(f);
  animate(f, [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300, easing: 'ease-out' });
}
async function scrubPet(side) {
  const p = pets[side], b = bath[side];

  b.busy = true;
  begin(p, 900);
  Sound.play('scrub');

async function dryPet(side) {

  const m = petPoint(p, 0.5, 0.4);

  const water = b.tub.querySelector('.water');
  await tween(500, t => { water.style.transform = `scaleY(${1 - t})`; });
  b.bubbles.forEach(f => f.remove());
  if (b.duck) b.duck.remove();
  await animate(b.tub, [{ transform: 'translateX(-50%) translateY(0)', opacity: 1 }, { transform: 'translateX(-50%) translateY(40%)', opacity: 0 }], { duration: 400, fill: 'forwards' });
  endBath(side);
  S.pets[side].mud = 0;
  renderMud(side);

function endBath(side) {

}
const isFluffy = side => Date.now() < S.pets[side].fluffyUntil;
function renderFluffy(side) { pets[side].root.classList.toggle('fluffy', isFluffy(side)); }
async function brushPet(side) {
  const p = pets[side];

  Sound.play('brush');

    br.style.left = a.x + (c.x - a.x) * t + 'px';
