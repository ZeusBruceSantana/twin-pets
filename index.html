<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twin Pets">
<meta name="application-name" content="Twin Pets">
<meta name="theme-color" content="#fff8ef">
<meta name="format-detection" content="telephone=no">
<title>Twin Pets</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body data-scene="boot">
<div id="stage">
  <div id="rooms"></div>
  <div class="half-night left" id="night-left"></div>
  <div class="half-night right" id="night-right"></div>
  <div id="night"><div id="moon"></div></div>
  <div class="girl-name" id="name-left"></div>
  <div class="girl-name" id="name-right"></div>
  <div id="center">
    <div id="jar"></div>
    <div id="midbtns"></div>
    <div id="gamebar"><div id="dots"></div><div class="cbtn" id="home-btn"></div></div>
  </div>
  <div class="tricklist" id="tricks-left"></div>
  <div class="tricklist" id="tricks-right"></div>
  <div id="world"></div>
  <div id="goodnight"></div>
  <div id="hint"></div>
  <div class="column left" id="col-left"></div>
  <div class="column right" id="col-right"></div>

  <!-- start screen -->
  <div class="overlay" id="title">
    <div class="logo"><span class="w1">Twin</span> <span class="w2">Pets</span></div>
    <div class="round-btn pulse" id="start-btn"></div>
    <div class="heart-btn" id="dedication-btn"></div>
  </div>

  <!-- a page of thanks, from the heart button on the start screen -->
  <div class="overlay" id="dedication"><div class="card"></div></div>

  <!-- first launch: each girl picks her color -->
  <div class="overlay" id="picker">
    <div class="pick-half" data-side="left"><div class="pick-name"></div><div class="pick-pet art happy"></div><div class="swatches"></div></div>
    <div class="pick-mid"><div class="round-btn" id="go-btn"></div></div>
    <div class="pick-half" data-side="right"><div class="pick-name"></div><div class="pick-pet art happy"></div><div class="swatches"></div></div>
  </div>

  <!-- the house map -->
  <div class="overlay" id="map"><div class="map-grid"></div><div class="map-x"></div></div>

  <!-- the memory book -->
  <div class="overlay" id="book"><div class="book"></div></div>

  <!-- grown-ups only -->
  <div class="overlay" id="parent"><div class="panel"></div></div>
  <div id="corner"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="rgba(255,255,255,.7)" stroke="#d9d3e6" stroke-width="5"/><circle class="ring" cx="25" cy="25" r="20" fill="none" stroke="#8b7fd1" stroke-width="5" stroke-linecap="round"/></svg></div>
</div>

<div id="rotate">
  <svg viewBox="0 0 100 100"><rect x="30" y="12" width="40" height="76" rx="8" fill="#fff" stroke="#8b7fd1" stroke-width="6"/><circle cx="50" cy="78" r="4" fill="#8b7fd1"/></svg>
</div>

     These are the built-in drawings. To use your own drawings or photos
     instead, you do NOT need to edit these. See "PET ART" near the top of
     the script below (and art/README.md).
     ===================================================================== -->

<!-- The game code. js/settings.js holds the things that are safe to change. -->
<!-- The game's code. The order matters: settings first, start.js last.
     settings  names, settings and pet pictures (safe to change)
     pictures  drawings for buttons and presents
     core      saving, sounds, the pets, the jar, games, wishes, memory book
     house     the rooms and the first things to do in them
     screens   button strips, color picker, start screen, grown-up corner
     map, newthings, panels   the house map, new things a few at a time, choice panels and activities
     kitchen ... seasons      one file for each part of the house and each kind of fun
     start     starts the game -->
<script src="js/settings.js?v=4"></script>
<script src="js/pictures.js?v=4"></script>
<script src="js/core.js?v=4"></script>
<script src="js/house.js?v=4"></script>
<script src="js/screens.js?v=4"></script>
<script src="js/map.js?v=4"></script>
<script src="js/newthings.js?v=4"></script>
<script src="js/panels.js?v=4"></script>
<script src="js/kitchen.js?v=4"></script>
<script src="js/bathroom.js?v=4"></script>
<script src="js/garden.js?v=4"></script>
<script src="js/closet.js?v=4"></script>
<script src="js/frontyard.js?v=4"></script>
<script src="js/photos.js?v=4"></script>
<script src="js/grownups.js?v=4"></script>
<script src="js/backup.js?v=4"></script>
<script src="js/school.js?v=4"></script>
<script src="js/playroom.js?v=4"></script>
<script src="js/trips.js?v=4"></script>

<script src="js/decor.js?v=4"></script>
<script src="js/seasons.js?v=4"></script>
<script src="js/music.js?v=4"></script>
<script src="js/start.js?v=4"></script>
