/* =====================================================================
   19. THE BACKYARD: trampolines, rainbow climb, mud
   ===================================================================== */
const MUD_SPOTS = [[37, 74, 17], [64, 62, 15], [62, 22, 10]];   // [left %, top %, size %]
function renderMud(side, pop) {
  const box = pets[side].art;
  box.querySelectorAll('.mud').forEach(m => m.remove());
  const n = Math.min(3, Math.floor(S.pets[side].mud));
  MUD_SPOTS.slice(0, n).forEach(([x, y, sz], i) => {
    const m = el('div', 'mud', ICONS.mud);
    Object.assign(m.style, { left: x - sz / 2 + '%', top: y + '%', width: sz + '%', height: sz + '%' });
    box.append(m);
    if (pop && i === n - 1) animate(m, [{ transform: 'scale(0)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 350, easing: 'ease-out' });
  });

function addMud(side, amount) {

/* --- Rainbow climb: each girl taps to climb her own side. The pets meet
       at the top and slide down together. Whoever gets there first waits. --- */
const CLIMB_STEPS = 8;
let climb = null;
function climbSpot(side, f) {
  const th = side === 'left' ? Math.PI - f * (Math.PI / 2 - 0.14) : f * (Math.PI / 2 - 0.14);
  return { x: 50 + 29.9 * Math.cos(th), y: 10 + 43.9 * Math.sin(th) };
}
async function startClimb() {
  if (!canAct()) return;
  const c = climb = { cur: { left: 0, right: 0 }, target: { left: 0, right: 0 }, top: { left: false, right: false }, busy: true, lastPress: now() };
  SIDES.forEach(s => begin(pets[s], 1e9));
  setScene('climb');
  c.el = el('div', 'rainbow', ICONS.rainbowArc);
  world.append(c.el);
  Sound.play('rainbow');
  animate(c.el, [{ transform: 'translateX(-50%) scaleY(0)', opacity: 0 }, { transform: 'translateX(-50%) scaleY(1)', opacity: 1 }], { duration: 800, easing: 'ease-out' });
  SIDES.forEach(s => { pets[s].lean.style.transform = 'scale(.55)'; mood(pets[s], 'happy', 1500); });
  await Promise.all(SIDES.map(s => { const q = climbSpot(s, 0); return movePet(s, q.x, q.y, 700); }));
  if (climb !== c) return;
  c.busy = false;
  renderColumns();
  requestAnimationFrame(climbLoop);
}
function climbLoop() {
  const c = climb;
  if (!c || c.busy || c.ending) return;
  SIDES.forEach(side => {
    const d = c.target[side] - c.cur[side];
    if (d <= 0) return;
    c.cur[side] += Math.min(d, 0.03);
    const q = climbSpot(side, c.cur[side]);
    setPos(pets[side], q.x, q.y + Math.abs(Math.sin(c.cur[side] * CLIMB_STEPS * Math.PI)) * 2.2);
    if (c.cur[side] >= 1 && !c.top[side]) reachTop(side);
  });
  if (climb === c && !c.busy) requestAnimationFrame(climbLoop);
}
function climbPress(side) {
  const c = climb;
  if (!c || c.busy || c.ending) return;
  c.lastPress = now();
  if (c.top[side]) { hopPet(side); Sound.play('giggle'); return; }   // already up: a happy wiggle while she waits
  c.target[side] = Math.min(1, c.target[side] + 1 / CLIMB_STEPS);
  Sound.play('climbStep', Math.round(c.target[side] * CLIMB_STEPS));
}
function reachTop(side) {
  const c = climb, p = pets[side];
  c.top[side] = true;
  mood(p, 'happy', 60000);
  const m = petPoint(p, 0.5, 0.75);
  sparkles(m.x, m.y, 8);
  Sound.play('pick');
  renderColumn(side);
  if (c.top[other(side)]) slideDown();
  else invite(other(side), 'climbup', 30000);
}
async function slideDown() {
  const c = climb;
  c.busy = true;
  Sound.play('yay');
  pets.left.lean.style.transform = 'scale(.55) rotate(9deg)';
  pets.right.lean.style.transform = 'scale(.55) rotate(-9deg)';
  SIDES.forEach(s => floatHearts(pets[s], 2));
  await wait(1100);
  Sound.play('slide');
  pets.left.lean.style.transform = 'scale(.55) rotate(-22deg)';
  pets.right.lean.style.transform = 'scale(.55) rotate(22deg)';
  await tween(1400, t => SIDES.forEach(s => { const q = climbSpot(s, 1 - t); setPos(pets[s], q.x, q.y); }), t => t * t);
  SIDES.forEach(s => { pets[s].lean.style.transform = 'scale(.55)'; hopPet(s); });
  const m = midPets();
  sparkles(m.x, H() * 0.8, 14);
  togetherMoment('rainbow');
  SIDES.forEach(s => addMud(s, 0.5));
  await wait(700);
  endClimb();
}
async function endClimb() {
  const c = climb;
  if (!c || c.ending) return;
  c.ending = true;
  animate(c.el, [{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' }).then(() => c.el.remove());
  SIDES.forEach(s => { pets[s].lean.style.transform = ''; pets[s].root.classList.remove('happy'); });
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 800), movePet('right', HOME.right.x, HOME.right.y, 800)]);
  SIDES.forEach(s => { pets[s].busyUntil = 0; });
  climb = null;
  endScene();
}

const inviteUntil = { left: {}, right: {} };
const newShown = { left: {}, right: {} };
/* Which buttons show on a girl's edge right now. Each room shows only its own. */
function columnPlan(side) {
  if (scene === 'night') return { acts: ['wake'], big: true };
  if (scene === 'game' && game) return { acts: [GAMES[game.kind].act], big: true };
  if (scene === 'climb' && climb) return { acts: ['climbup'], big: true, cls: climb.top[side] ? 'done' : 'invite' };
  if (scene === 'presents' && presents) return { acts: ['give'], big: true, cls: presents.given[side] ? 'done' : 'invite' };
  if (sideMode[side] === 'tricks') return { acts: [...TRICKS.map(t => 'trick:' + t.key), 'back'], cards: true };
  const p = pets[side], ps = S.pets[side];
  const acts = ROOMS[S.room].acts
    .filter(a => !LOCKED_BY[a] || S.unlocked[LOCKED_BY[a]])
    .filter(a => a !== 'dress' || ps.owned.some(i => WEARABLES[i] === 'head'))
    .map(a => (a === 'sleep' && p && p.asleep ? 'wake' : a === 'bath' ? bathAct(side) : a));
  return { acts, dim: !['play', 'title'].includes(scene) };
}
function renderColumns() { SIDES.forEach(renderColumn); }
function renderColumn(side) {
  const col = cols[side];
  const plan = columnPlan(side);
  col.innerHTML = '';
  col.classList.toggle('big', !!plan.big);
  col.classList.toggle('dim', !!plan.dim);
  col.classList.toggle('cards', !!plan.cards);
  for (const act of plan.acts) {
    if (act.startsWith('trick:')) {            // a trick word card: tap to hear it, and the pet tries
      const key = act.slice(6), tr = trickBy(key);
      const b = el('div', 'btn btn-trick' + (knows(side, key) ? ' learned' : ''), `<span class="ico">${ICONS[tr.icon]}</span><span class="lbl">${tr.word}</span>`);
      if (knows(side, key)) b.append(el('span', 'star', ICONS.star));
      onRelease(b, () => trickCard(side, key));
      col.append(b);
      continue;
    }
    const def = BUTTONS[act];
    const b = el('div', 'btn btn-' + act, `<span class="ico">${ICONS[def.icon]}</span><span class="lbl">${def.label}</span>`);
    b.dataset.act = act;
    if (plan.cls) b.classList.add(plan.cls);
    if ((newUntil[act] || 0) > Date.now() && newShown[side][act] !== newUntil[act]) {   // pop in once, not every redraw
      b.classList.add('new');
      newShown[side][act] = newUntil[act];
    }
    if ((inviteUntil[side][act] || 0) > Date.now()) b.classList.add('invite');
    if (act === 'book') onRelease(b, () => press(side, act, b));
    else onPress(b, () => press(side, act, b));

function press(side, act, btn) {

  if (scene === 'climb') { climbPress(side); return; }

  if (!canAct()) return;

  else if (act === 'treat') giveTreat(side, btn);
  else if (act === 'play') playBall(side);
  else if (act === 'tricks') { sideMode[side] = 'tricks'; trickTouched[side] = now(); Sound.play('pick'); renderColumn(side); }
  else if (act === 'back') { sideMode[side] = null; renderColumn(side); }
  else if (act === 'fivegame') startGame('highfive', side);
  else if (act === 'ballgame') startGame('ball', side);
  else if (act === 'seesawgame') startGame('seesaw', side);
  else if (act === 'dress') cycleDress(side);
  else if (act === 'bath' || act === 'scrub' || act === 'dry') bathStep(side);
  else if (act === 'brush') brushPet(side);
  else if (act === 'bounce') bounce(side);
  else if (act === 'climb') startClimb();
  else if (act === 'sleep') goSleep(side);
  else if (act === 'wake') wakePet(side);
  else if (act === 'book') openBook();
}
const FOOD_ACTS = ['apple', 'fish', 'bone'];
/* Gently glow a button on the sister's side ("come join in!"). */
function invite(side, act, ms) {
  inviteUntil[side][act] = Date.now() + ms;
  const b = cols[side].querySelector('.btn-' + act);
  if (b) b.classList.add('invite');
  setTimeout(() => {
    const b2 = cols[side].querySelector('.btn-' + act);
    if (b2 && (inviteUntil[side][act] || 0) <= Date.now()) b2.classList.remove('invite');
  }, ms + 50);
}
function nudge(elm) {
  if (!elm) return;
  Sound.play('soft');
  elm.classList.remove('nudge'); void elm.offsetWidth; elm.classList.add('nudge');
}

/* =====================================================================
   23. PETS WAIT HAPPILY (little idle wiggles)
   ===================================================================== */
function idleTick() {
  // nobody has tapped for a while: go back to normal, gently
  if (scene === 'game' && game && game.ready && !game.busy && now() - game.lastPress > 25000) finishGame(false);
  if (scene === 'climb' && climb && !climb.busy && now() - climb.lastPress > 30000) endClimb();
  SIDES.forEach(side => {
    if (sideMode[side] === 'tricks' && now() - trickTouched[side] > 45000) { sideMode[side] = null; renderColumn(side); }
    if (pets[side].root.classList.contains('fluffy') !== isFluffy(side)) renderFluffy(side);
    tummyLook(side);
  });
  if (!['play', 'title'].includes(scene)) return;
  SIDES.forEach(side => {
    const p = pets[side];
    if (p.asleep || bath[side] || now() < p.busyUntil || Math.random() > 0.2) return;
    p.busyUntil = now() + 1800;
    const what = pick(['wag', 'hop', 'look', 'wag']);
    if (what === 'wag') { p.root.classList.add('wag'); setTimeout(() => p.root.classList.remove('wag'), 1600); }
    if (what === 'hop') petAnim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-5%)' }, { transform: 'translateY(0)' }], { duration: 420, easing: 'ease-out' });
    if (what === 'look') {
      const dir = side === 'left' ? 1 : -1;
      petAnim(p, [{ transform: 'rotate(0)' }, { transform: `rotate(${dir * 6}deg)`, offset: 0.25 }, { transform: `rotate(${dir * 6}deg)`, offset: 0.75 }, { transform: 'rotate(0)' }], { duration: 1500 });
    }
  });
}

/* =====================================================================
   24. FIRST LAUNCH: PICK A COLOR
   ===================================================================== */
const picking = { left: null, right: null };
function openPicker() {
  // tidy away a game or gift that was in the middle of happening
  if (game) { game.ending = true; game.cleanup.forEach(f => f()); game = null; }
  if (presents) { SIDES.forEach(s => presents.box[s] && presents.box[s].remove()); presents = null; }
  if (climb) { climb.ending = true; climb.el.remove(); climb = null; }
  closeSideModes();
  closeBook();
  setScene('pick');
  picking.left = S.colors.left; picking.right = S.colors.right;
  $('#title').classList.remove('show');
  const picker = $('#picker');
  picker.classList.add('show');
  picker.querySelectorAll('.pick-half').forEach(half => {
    const side = half.dataset.side;
    sayableInto(half.querySelector('.pick-name'), SETTINGS.players[side].girl);
    const petBox = half.querySelector('.pick-pet');
    fillArt(petBox, side);
    const sw = half.querySelector('.swatches');
    sw.innerHTML = '';
    COLORS.forEach(c => {
      const b = el('div', 'swatch', ICONS.check);
      b.style.setProperty('--sw', c.main);
      b.dataset.color = c.id;
      onTap(b, () => chooseColor(side, c.id, b));
      sw.append(b);
    });
  });
  updatePicker();
}
function chooseColor(side, id, b) {
  if (picking[other(side)] === id) { nudge(b); return; }   // sister already has it
  picking[side] = id;
  Sound.play('pick');
  const petBox = $(`.pick-half[data-side="${side}"] .pick-pet`);
  animate(petBox, [{ transform: 'translateY(0)' }, { transform: 'translateY(-12%)' }, { transform: 'translateY(0)' }], { duration: 420, easing: 'ease-out' });
  updatePicker();
}
function updatePicker() {
  $('#picker').querySelectorAll('.pick-half').forEach(half => {
    const side = half.dataset.side, mine = colorById(picking[side]);
    half.style.setProperty('--pbg', mine ? mine.light : '#f4efe9');
    half.style.setProperty('--pdark', mine ? mine.dark : '#6f6880');
    half.querySelectorAll('.swatch').forEach(b => {
      b.classList.toggle('chosen', b.dataset.color === picking[side]);
      b.classList.toggle('taken', b.dataset.color === picking[other(side)]);
    });
  });
  $('#go-btn').classList.toggle('show', !!(picking.left && picking.right));
}
function finishPicking() {
  if (!(picking.left && picking.right)) return;
  S.colors.left = picking.left; S.colors.right = picking.right; save();
  applyColors();
  makeHomeScreenIcon();
  $('#picker').classList.remove('show');
  startPlaying();
}

/* =====================================================================
   25. START SCREEN, FULL SCREEN, HOME SCREEN ICON
   ===================================================================== */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
function canFullscreen() {
  const d = document.documentElement;
  return !isIOS() && !isStandalone() && !!(d.requestFullscreen || d.webkitRequestFullscreen);
}
function tryFullscreen() {
  if (!canFullscreen() || document.fullscreenElement || document.webkitFullscreenElement) return;
  const d = document.documentElement;
  try {
    const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    if (r && r.catch) r.catch(() => {});
  } catch (e) { /* ignore */ }
}
function showTitle() {
  setScene('title');
  $('#title').classList.add('show');
}
function startPlaying() {
  $('#title').classList.remove('show');
  Sound.unlock();
  tryFullscreen();
  restorePets();
  const wasAsleep = S.pets.left.asleep || S.pets.right.asleep;
  SIDES.forEach(s => { S.pets[s].asleep = false; });
  save();
  setScene('play');
  if (wasAsleep) {      // they went to bed last time: good morning!
    Sound.play('morning');
    SIDES.forEach(s => { mood(pets[s], 'happy', 1600); floatHearts(pets[s], 2); });
  }
  setTimeout(() => {
    if (!S.seen.playroom) firstVisitHint('playroom');
    checkUnlocks();
    runQueue();
  }, 800);
}

/* The picture used when the game is saved to the home screen. */
function makeHomeScreenIcon() {
  const L = colorById(S.colors.left) || COLORS[0], R = colorById(S.colors.right) || COLORS[2];
  const draw = size => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = L.light; g.fillRect(0, 0, size / 2, size);
    g.fillStyle = R.light; g.fillRect(size / 2, 0, size / 2, size);
    g.save();
    g.translate(size * 0.12, size * 0.14); g.scale(size * 0.0076, size * 0.0076);
    const heart = new Path2D('M50 88 C 18 66, 6 46, 12 30 C 18 14, 42 12, 50 30 C 58 12, 82 14, 88 30 C 94 46, 82 66, 50 88Z');
    g.save(); g.beginPath(); g.rect(0, 0, 50, 100); g.clip(); g.fillStyle = L.main; g.fill(heart); g.restore();
    g.save(); g.beginPath(); g.rect(50, 0, 50, 100); g.clip(); g.fillStyle = R.main; g.fill(heart); g.restore();
    g.restore();
    return c.toDataURL('image/png');
  };
  try {
    const i180 = draw(180), i192 = draw(192), i512 = draw(512);
    const link = (rel, href, extra) => {
      let l = document.querySelector(`link[rel="${rel}"]`);
      if (!l) { l = document.createElement('link'); l.rel = rel; document.head.append(l); }
      l.href = href;
      if (extra) Object.assign(l, extra);
    };
    link('apple-touch-icon', i180);
    link('icon', i192);
    const here = location.href.split('#')[0];
    const manifest = {
      name: 'Twin Pets', short_name: 'Twin Pets', start_url: here, scope: here.replace(/[^/]*$/, ''),
      display: 'standalone', display_override: ['fullscreen', 'standalone'], orientation: 'landscape',
      background_color: '#fff8ef', theme_color: '#fff8ef',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }],
    };
    link('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) { /* not important */ }
}

/* =====================================================================
   26. GROWN-UP CORNER (press and hold the top-left corner for 3 seconds)
   ===================================================================== */
(function setupCorner() {
  const corner = $('#corner');
  let timer = 0;
  const stop = () => { clearTimeout(timer); corner.classList.remove('holding'); };
  corner.addEventListener('pointerdown', e => {
    e.preventDefault();
    corner.classList.add('holding');
    clearTimeout(timer);
    timer = setTimeout(() => { stop(); openParent(); }, 3000);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => corner.addEventListener(ev, stop));
})();
let resetArmed = 0;
function openParent() {
  resetArmed = 0;
  $('#parent').classList.add('show');
  renderParent();
}
function renderParent() {
  const v = Math.round(S.sound.volume * 10);
  let bars = '';
  for (let i = 1; i <= 10; i++) bars += `<i class="${i <= v ? 'on' : ''}"></i>`;
  $('#parent .panel').innerHTML = `
    <h2>Grown-ups</h2>
    <div class="row"><span>Sound</span><div class="pbtn ${S.sound.muted ? '' : 'on'}" data-p="mute">${S.sound.muted ? 'Off (tap to turn on)' : 'On (tap to mute)'}</div></div>
    <div class="row"><span>Volume</span><div class="pbtn round" data-p="vol-">−</div><div class="volbar">${bars}</div><div class="pbtn round" data-p="vol+">+</div></div>
    <div class="row"><div class="pbtn" data-p="colors">Change colors</div>${canFullscreen() ? '<div class="pbtn" data-p="fs">Full screen</div>' : ''}</div>
    <div class="row"><div class="pbtn" data-p="unlock">Show all new things now (for testing)</div></div>
    <div class="row"><div class="pbtn danger ${resetArmed ? 'confirm' : ''}" data-p="reset">${resetArmed ? 'Tap again to erase everything' : 'Start over'}</div></div>
    <div class="row"><div class="pbtn go" data-p="done">Done</div></div>
    <div class="note">Twin Pets saves on this device only.</div>`;
  $('#parent .panel').querySelectorAll('[data-p]').forEach(b => onRelease(b, () => parentAction(b.dataset.p)));
}
function parentAction(what) {
  if (what !== 'reset') resetArmed = 0;
  if (what === 'mute') {
    S.sound.muted = !S.sound.muted;
    if (S.sound.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
    Sound.applyVolume();
    Sound.play('pick');
  } else if (what === 'vol-' || what === 'vol+') {
    S.sound.volume = Math.min(1, Math.max(0.1, Math.round((S.sound.volume + (what === 'vol+' ? 0.1 : -0.1)) * 10) / 10));
    Sound.applyVolume();
    Sound.play('pick');
  } else if (what === 'colors') {
    closeParent();
    openPicker();
    return;
  } else if (what === 'unlock') {
    S.together = Math.max(S.together, ...Object.values(SETTINGS.unlockAt));
    Object.keys(SETTINGS.unlockAt).forEach(k => { S.unlocked[k] = true; });
    queue.length = 0;
    renderJar(); renderColumns(); renderDoors();
  } else if (what === 'fs') {
    tryFullscreen();
  } else if (what === 'reset') {
    if (resetArmed && Date.now() - resetArmed < 6000) {
      erasing = true;
      try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
      location.reload();
      return;
    }
    resetArmed = Date.now();
  } else if (what === 'done') {
    closeParent();
    return;
  }
  save();
  renderParent();
}
function closeParent() { $('#parent').classList.remove('show'); }

/* =====================================================================
   27. NO ZOOMING, NO SCROLLING, NO TEXT SELECTION, NO LONG-PRESS MENUS
   ===================================================================== */
['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
['touchend', 'pointerup', 'click'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), { passive: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* =====================================================================
   28. GO!
   ===================================================================== */
buildScene();
applyColors();
$('#home-btn').innerHTML = ICONS.home;
onPress($('#home-btn'), () => {
  if (game && game.ready) finishGame(false);
  else if (climb && !climb.busy) endClimb();
});
renderJar();
onTap($('#book'), e => { if (e.target.id === 'book') closeBook(); });
Speech.init();
makeHomeScreenIcon();
onRelease($('#title'), startPlaying);
onRelease($('#go-btn'), finishPicking);
setInterval(() => { idleTick(); wishTick(); }, 1000);
restorePets();
if (S.colors.left && S.colors.right) showTitle(); else openPicker();
</script>
</body>
