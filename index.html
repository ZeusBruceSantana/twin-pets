<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twin Pets">
<meta name="application-name" content="Twin Pets">
<meta name="theme-color" content="#fff8ef">
<meta name="format-detection" content="telephone=no">
<title>Twin Pets</title>
<style>
/* =====================================================================
   LOOK AND FEEL
   Colors for each girl's side are filled in by the game after she picks.
   ===================================================================== */
:root {
  --L: #c9c3d3; --L-light: #f3f0ec; --L-dark: #6f6880;
  --R: #c9c3d3; --R-light: #f3f0ec; --R-dark: #6f6880;
  --col: 19vmin;            /* width of each girl's button strip */
  --btn: 16vmin;            /* size of each button */
  --pet: 33vmin;            /* size of each pet */
  --ink: #3e3a4f;
  --font: ui-rounded, "SF Pro Rounded", "Century Gothic", "Segoe UI", system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
}
* {
  box-sizing: border-box;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  margin: 0; height: 100%; overflow: hidden;
  overscroll-behavior: none; touch-action: none;
  background: #fff8ef; color: var(--ink); font-family: var(--font);
}
body { position: fixed; inset: 0; }
svg { display: block; }

#stage { position: fixed; inset: 0; overflow: hidden; background: #fff8ef; }

/* ---------- background ---------- */
#sky {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, var(--L-light) 0%, var(--L-light) 36%, #fffaf3 50%, var(--R-light) 64%, var(--R-light) 100%);
}
.cloud {
  position: absolute; width: 20vmin; height: 7vmin; background: #fff; border-radius: 7vmin; opacity: .85;
  animation: drift 90s linear infinite;
}
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 9vmin; height: 9vmin; left: 3vmin; top: -4.5vmin; }
.cloud::after  { width: 7vmin; height: 7vmin; left: 9.5vmin; top: -3vmin; }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
#ground { position: absolute; left: 0; bottom: 0; width: 100%; height: 32%; }

/* night on one half (one pet asleep) and on the whole screen (both asleep) */
.half-night {
  position: absolute; top: 0; bottom: 0; width: 50%; z-index: 3; pointer-events: none;
  background: linear-gradient(#24306a, #46559a); opacity: 0; transition: opacity 1.6s ease;
}
.half-night.left { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 80%, transparent); mask-image: linear-gradient(90deg, #000 80%, transparent); }
.half-night.right { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 80%, transparent); mask-image: linear-gradient(270deg, #000 80%, transparent); }
.half-night.on { opacity: .5; }
#night {
  position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 2.5s ease;
  background: linear-gradient(#141c48, #34407e 70%, #4a5a96);
}
#night.on { opacity: .82; }
.star { position: absolute; width: 1.2vmin; height: 1.2vmin; background: #fff6c8; border-radius: 50%; animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.1); } }
#moon { position: absolute; left: 61%; top: calc(13vmin + var(--safe-top)); width: 12vmin; height: 12vmin; transform: translateX(-50%); }
#moon svg { width: 100%; height: 100%; }
#goodnight {
  position: absolute; left: 50%; top: 27%; transform: translateX(-50%); z-index: 25;
  font: 900 8vmin/1 var(--font); color: #fff6c8; text-shadow: 0 .6vmin 0 rgba(0,0,0,.25);
  opacity: 0; transition: opacity 1.5s ease; pointer-events: none; white-space: nowrap;
}
#goodnight.on { opacity: 1; pointer-events: auto; }

/* ---------- names at the top ---------- */
.girl-name {
  position: absolute; top: calc(2.5vmin + var(--safe-top)); transform: translateX(-50%); z-index: 6;
  font: 900 6vmin/1 var(--font); padding: 1vmin 3.2vmin; border-radius: 5vmin;
  background: rgba(255,255,255,.75);
}
#name-left  { left: 29.5%; color: var(--L-dark); }
#name-right { left: 70.5%; color: var(--R-dark); }

/* ---------- the world: pets and flying things ---------- */
#world { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#world > * { pointer-events: auto; }
.pet { position: absolute; width: var(--pet); height: var(--pet); transform: translateX(-50%); z-index: 10; }
.pet .lean, .pet .bounce, .pet .art { position: absolute; inset: 0; transform-origin: 50% 100%; }
.pet .lean { transition: transform .35s ease; }
.pet .art { transition: transform .7s ease; }
.pet .art > svg { width: 100%; height: 100%; overflow: visible; }
.pet.asleep .art { transform: translateY(5%) scaleY(.86) scaleX(1.05); }
.pet.walking .bounce { animation: hop .3s ease-in-out infinite alternate; }
.pet.running .bounce { animation: hop .2s ease-in-out infinite alternate; }
@keyframes hop { from { transform: translateY(0); } to { transform: translateY(-6%); } }

/* your own pictures (see PET ART in the script) */
.art.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; -webkit-user-drag: none; }
.art.photo .img-asleep { display: none; }
.asleep .art.photo.has-asleep { transform: none; }
.asleep .art.photo.has-asleep .img-awake { display: none; }
.asleep .art.photo.has-asleep .img-asleep { display: block; }

/* faces: which eyes and mouth show */
.pet-svg .eyes-happy, .pet-svg .eyes-closed, .pet-svg .mouth-open, .pet-svg .tail-front { display: none; }
.happy .pet-svg .eyes-open { display: none; }
.happy .pet-svg .eyes-happy { display: inline; }
.happy .pet-svg .mouth-closed, .chomp .pet-svg .mouth-closed { display: none; }
.happy .pet-svg .mouth-open, .chomp .pet-svg .mouth-open { display: inline; }
.asleep .pet-svg .eyes-open, .asleep .pet-svg .eyes-happy, .asleep .pet-svg .mouth-open { display: none; }
.asleep .pet-svg .eyes-closed, .asleep .pet-svg .mouth-closed { display: inline; }
.asleep .pet-svg .tail { display: none; }
.asleep .pet-svg .tail-front { display: inline; }
.pet-svg .head { transform-box: fill-box; transform-origin: 50% 90%; transition: transform .7s ease; }
.asleep .pet-svg .head { transform: translateY(12px) rotate(-7deg); }
.pet-svg .eyes-open { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.6s infinite; }
.side-right .pet-svg .eyes-open { animation-delay: -2.2s; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.08); } }
.pet-svg .tail { transform-box: fill-box; transform-origin: 0% 100%; }
.wag .pet-svg .tail { animation: wag .26s ease-in-out 6 alternate; }
@keyframes wag { from { transform: rotate(-9deg); } to { transform: rotate(11deg); } }

.zzz { position: absolute; right: 8%; top: 18%; display: none; pointer-events: none; font: 900 5vmin/1 var(--font); color: #8193d6; }
.asleep .zzz { display: block; }
.zzz span { position: absolute; opacity: 0; animation: zfloat 3.2s linear infinite; }
.zzz span:nth-child(2) { animation-delay: 1.05s; font-size: .8em; }
.zzz span:nth-child(3) { animation-delay: 2.1s; font-size: 1.25em; }
@keyframes zfloat { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(5vmin,-11vmin); opacity: 0; } }

.tag {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, .2vmin); white-space: nowrap;
  font: 900 3.6vmin/1 var(--font); padding: .8vmin 2.4vmin; border-radius: 4vmin;
  background: #fff; border: .5vmin solid var(--c); color: var(--c-dark); transition: opacity .4s;
}
.side-left  { --c: var(--L); --c-dark: var(--L-dark); --c-light: var(--L-light); }
.side-right { --c: var(--R); --c-dark: var(--R-dark); --c-light: var(--R-light); }
body:not([data-scene="play"]):not([data-scene="title"]) .tag, .pet.asleep .tag { opacity: 0; pointer-events: none; }

.say {
  position: absolute; left: 50%; bottom: 96%; transform: translateX(-50%); z-index: 30;
  background: #fff; border-radius: 4vmin; padding: 1.6vmin 3vmin; white-space: nowrap;
  font: 900 4.6vmin/1.15 var(--font); color: var(--ink); box-shadow: 0 1vmin 0 rgba(0,0,0,.08);
}
.say::after { content: ''; position: absolute; left: 50%; top: 100%; margin-left: -2vmin; border: 2vmin solid transparent; border-top-color: #fff; }

.prop { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 15; }
.prop > div { width: 100%; height: 100%; }
.prop svg { width: 100%; height: 100%; overflow: visible; }

/* words you can tap to hear */
.word { display: inline-block; cursor: pointer; }
.word.said { animation: said .45s ease; }
@keyframes said { 40% { transform: scale(1.25) translateY(-.8vmin); color: #ff5d8f; } }

/* ---------- each girl's button strip ---------- */
.column {
  position: absolute; top: 0; bottom: 0; width: var(--col); z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin;
  padding: calc(11vmin + var(--safe-top)) 0 3vmin;
}
.column::before { content: ''; position: absolute; inset: 0; background: var(--c); opacity: .2; z-index: -1; }
.column.left  { left: 0;  --c: var(--L); --c-dark: var(--L-dark); --c-light: var(--L-light); }
.column.right { right: 0; --c: var(--R); --c-dark: var(--R-dark); --c-light: var(--R-light); }
.column.left::before  { border-radius: 0 6vmin 6vmin 0; }
.column.right::before { border-radius: 6vmin 0 0 6vmin; }
.btn {
  position: relative; width: var(--btn); height: var(--btn); flex: none;
  border-radius: 4.5vmin; background: #fff; border: .9vmin solid var(--c);
  box-shadow: 0 1.2vmin 0 var(--c-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--c-dark); font: 900 3.4vmin/1 var(--font);
  transition: transform .08s ease, box-shadow .08s ease, opacity .4s ease;
}
.btn .ico { width: 9.5vmin; height: 9.5vmin; pointer-events: none; }
.btn .ico > svg { width: 100%; height: 100%; overflow: visible; }
.btn .lbl { margin-top: .5vmin; pointer-events: none; text-align: center; line-height: 1.05; }
.btn.down { transform: translateY(.9vmin) scale(.96); box-shadow: 0 .3vmin 0 var(--c-dark); }
.column.big .btn { width: 17vmin; height: 46vmin; border-radius: 6vmin; }
.column.big .btn .ico { width: 13vmin; height: 13vmin; }
.column.big .btn .lbl { font-size: 4vmin; margin-top: 1.5vmin; }
.column.dim .btn { opacity: .4; }
.btn.nudge { animation: nudge .4s ease; }
@keyframes nudge { 20% { transform: translateX(-1.2vmin); } 40% { transform: translateX(1.2vmin); } 60% { transform: translateX(-.8vmin); } 80% { transform: translateX(.6vmin); } }
.btn.invite { animation: invite .7s ease-in-out infinite alternate; }
@keyframes invite { from { box-shadow: 0 1.2vmin 0 var(--c-dark), 0 0 0 0 var(--c); } to { box-shadow: 0 1.2vmin 0 var(--c-dark), 0 0 0 1.6vmin var(--c); } }
.btn.new { animation: newbtn 1s ease-out, invite .7s ease-in-out 1s 8 alternate; }
@keyframes newbtn { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.18) rotate(6deg); } 100% { transform: scale(1); } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

/* ---------- the shared middle: friendship jar and together games ---------- */
#center { position: absolute; left: 50%; top: 0; bottom: 0; width: 16vmin; transform: translateX(-50%); z-index: 9; pointer-events: none; }
#center > * { pointer-events: auto; }
#jar { position: absolute; left: 50%; top: calc(1.5vmin + var(--safe-top)); width: 15vmin; height: 18.6vmin; transform: translateX(-50%); display: none; transition: opacity .8s ease; }
#jar.show { display: block; }
#jar > svg { width: 100%; height: 100%; overflow: visible; }
#jar.wiggle { animation: jarwiggle .5s ease; }
@keyframes jarwiggle { 25% { transform: translateX(-50%) rotate(-7deg) scale(1.06); } 75% { transform: translateX(-50%) rotate(6deg) scale(1.06); } }
#jar.full { animation: jarglow .8s ease-in-out infinite alternate; }
@keyframes jarglow { from { filter: drop-shadow(0 0 0 #ffd23f); transform: translateX(-50%) scale(1); } to { filter: drop-shadow(0 0 2.5vmin #ffd23f); transform: translateX(-50%) scale(1.08); } }
#jar.pop { animation: jarpop .9s ease-out; }
@keyframes jarpop { 0% { transform: translateX(-50%) translateY(-30vmin); } 60% { transform: translateX(-50%) translateY(2vmin); } 100% { transform: translateX(-50%) translateY(0); } }
#games { position: absolute; left: 50%; top: calc(24vmin + var(--safe-top)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 3vmin; align-items: center; transition: opacity .4s ease; }
body:not([data-scene="play"]) #games { opacity: 0; pointer-events: none; }
.cbtn {
  width: 12.5vmin; height: 12.5vmin; border-radius: 50%; padding: 1.8vmin; flex: none;
  border: .9vmin solid transparent;
  background: linear-gradient(#fff, #fff) padding-box, linear-gradient(90deg, var(--L) 50%, var(--R) 50%) border-box;
  box-shadow: 0 1vmin 0 rgba(0,0,0,.15); transition: transform .08s ease, opacity .4s ease;
}
.cbtn > svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cbtn svg { pointer-events: none; }
.cbtn.down { transform: translateY(.8vmin); box-shadow: 0 .2vmin 0 rgba(0,0,0,.15); }
.cbtn.sleepy { opacity: .4; }
.cbtn.nudge { animation: nudge .4s ease; }
.cbtn.new { animation: newbtn 1s ease-out, cglow .7s ease-in-out 1s 8 alternate; }
@keyframes cglow { from { box-shadow: 0 1vmin 0 rgba(0,0,0,.15), 0 0 0 0 rgba(255,210,63,0); } to { box-shadow: 0 1vmin 0 rgba(0,0,0,.15), 0 0 0 1.8vmin rgba(255,210,63,.75); } }
#gamebar { position: absolute; left: 50%; top: calc(22vmin + var(--safe-top)); transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 2.4vmin; }
body[data-scene="game"] #gamebar { display: flex; }
#dots { display: grid; grid-template-columns: repeat(4, 3.4vmin); gap: .8vmin; }
#dots i { width: 3.4vmin; height: 3.4vmin; display: block; }
#dots i svg { width: 100%; height: 100%; }
#home-btn { width: 10vmin; height: 10vmin; padding: 1.4vmin; }
.column.big .btn.done { opacity: .45; }

/* ---------- surprises ---------- */
.scenery { position: absolute; pointer-events: none; }
.scenery svg { width: 100%; height: 100%; overflow: visible; }
#party { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; transition: opacity 1s ease; overflow: hidden; background: linear-gradient(#2a1b4d, #4b2a6e); }
#party.on { opacity: .82; }
.light { position: absolute; width: 46vmin; height: 46vmin; border-radius: 50%; mix-blend-mode: screen; opacity: .7; animation: roam 4s ease-in-out infinite alternate; }
@keyframes roam { from { transform: translate(-12vmin, -6vmin) scale(.8); } to { transform: translate(14vmin, 8vmin) scale(1.15); } }
.gift { position: absolute; left: 50%; bottom: 12%; width: 26vmin; height: 26vmin; transform: translateX(-50%); z-index: 11; }
.gift svg { width: 100%; height: 100%; overflow: visible; }
.gift g { transform-box: fill-box; transform-origin: 50% 100%; }
.gift.wobble { animation: giftwobble 1.4s ease-in-out infinite; }
@keyframes giftwobble { 0%, 60%, 100% { transform: translateX(-50%) rotate(0); } 70% { transform: translateX(-50%) rotate(-5deg); } 80% { transform: translateX(-50%) rotate(5deg); } 90% { transform: translateX(-50%) rotate(-3deg); } }
.seesaw-plank {
  position: absolute; height: 2.8vmin; z-index: 9; border-radius: 2vmin; border: .5vmin solid #fff;
  background: linear-gradient(90deg, var(--L) 50%, var(--R) 50%); box-shadow: 0 .6vmin 0 rgba(0,0,0,.15);
}
.seesaw-base { position: absolute; z-index: 8; }
.seesaw-base svg { width: 100%; height: 100%; }

/* ---------- big round buttons and overlays ---------- */
.round-btn {
  width: 18vmin; height: 18vmin; border-radius: 50%; background: #5cc77a; border: 1vmin solid #fff;
  box-shadow: 0 1.4vmin 0 #33935a, 0 0 0 1vmin rgba(92,199,122,.25);
  display: flex; align-items: center; justify-content: center; padding: 3.5vmin;
}
.round-btn svg { width: 100%; height: 100%; }
.round-btn.down { transform: translateY(1vmin); box-shadow: 0 .4vmin 0 #33935a; }
.overlay { position: absolute; inset: 0; z-index: 60; display: none; }
.overlay.show { display: flex; }
#title { align-items: center; justify-content: center; background: rgba(255,248,239,.35); }

/* color picker */
#picker { background: #fff8ef; }
.pick-half {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vmin;
  background: var(--pbg, #f4efe9); transition: background .4s ease;
}
.pick-name { font: 900 8vmin/1 var(--font); color: var(--pdark, #6f6880); }
.pick-pet { position: relative; width: 25vmin; height: 25vmin; }
.pick-pet > svg { width: 100%; height: 100%; overflow: visible; }
.swatches { display: grid; grid-template-columns: repeat(4, 11.5vmin); gap: 2.3vmin; }
.swatch {
  width: 11.5vmin; height: 11.5vmin; border-radius: 50%; background: var(--sw);
  border: .9vmin solid #fff; box-shadow: 0 .8vmin 0 rgba(0,0,0,.14);
  display: flex; align-items: center; justify-content: center; transition: transform .2s ease, opacity .3s ease;
}
.swatch svg { width: 60%; height: 60%; display: none; }
.swatch.chosen { transform: scale(1.15); border-color: var(--ink); }
.swatch.chosen svg { display: block; }
.swatch.taken { opacity: .15; }
.swatch.nudge { animation: nudge .4s ease; }
.pick-mid { width: 22vmin; display: flex; align-items: center; justify-content: center; }
#go-btn { visibility: hidden; }
#go-btn.show { visibility: visible; animation: newbtn .6s ease-out, pulse 1.6s ease-in-out .6s infinite; }

/* grown-up panel */
#parent { align-items: center; justify-content: center; background: rgba(40,36,56,.55); z-index: 90; }
.panel {
  background: #fff; border-radius: 4vmin; padding: 3vmin 4vmin; min-width: 60vmin; max-height: 94%;
  font: 700 3.2vmin/1.2 var(--font); color: var(--ink); box-shadow: 0 2vmin 6vmin rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 1.6vmin;
}
.panel h2 { margin: 0 0 1vmin; font-size: 4.4vmin; text-align: center; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 2vmin; }
.panel .row > span { min-width: 16vmin; }
.pbtn {
  border-radius: 2.4vmin; background: #f1eef7; border: .5vmin solid #d9d3e6; padding: 1.6vmin 2.6vmin;
  font: 800 3.2vmin/1 var(--font); color: var(--ink); text-align: center; flex: 1;
}
.pbtn.round { flex: none; width: 8vmin; height: 8vmin; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 5vmin; }
.pbtn.go { background: #5cc77a; border-color: #33935a; color: #fff; }
.pbtn.danger { background: #fff0f0; border-color: #f2b8b8; color: #b03a3a; }
.pbtn.danger.confirm { background: #e05555; border-color: #b03a3a; color: #fff; }
.pbtn.on { background: #e5f7ea; border-color: #8fd1a3; }
.pbtn.down { transform: scale(.96); }
.volbar { display: flex; gap: .8vmin; flex: 1; justify-content: center; }
.volbar i { width: 3vmin; height: 6vmin; border-radius: 1vmin; background: #e6e1ef; }
.volbar i.on { background: #8b7fd1; }
.panel .note { font-size: 2.4vmin; color: #857f96; text-align: center; font-weight: 600; }

/* hidden grown-up corner (top-left) */
#corner { position: absolute; left: 0; top: 0; width: 11vmin; height: calc(11vmin + var(--safe-top)); z-index: 100; }
#corner svg { position: absolute; left: 1.5vmin; top: calc(1.5vmin + var(--safe-top)); width: 8vmin; height: 8vmin; opacity: 0; transition: opacity .3s; }
#corner.holding svg { opacity: 1; }
#corner circle.ring { stroke-dasharray: 126; stroke-dashoffset: 126; transform: rotate(-90deg); transform-origin: 50% 50%; }
#corner.holding circle.ring { stroke-dashoffset: 0; transition: stroke-dashoffset 2.6s linear; }

/* please turn sideways */
#rotate {
  position: fixed; inset: 0; z-index: 200; background: #fff8ef; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
}
#rotate svg { width: 30vmin; height: 30vmin; animation: tilt 2.4s ease-in-out infinite; }
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body data-scene="boot">
<div id="stage">
  <div id="sky"></div>
  <div class="cloud" style="top:14%; animation-delay:-20s"></div>
  <div class="cloud" style="top:27%; animation-delay:-65s; animation-duration:120s"></div>
  <svg id="ground" viewBox="0 0 1000 200" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 58 C 160 22, 320 44, 500 52 C 690 60, 850 22, 1000 50 L1000 200 L0 200Z" fill="#cdeeb6"/>
    <path d="M0 96 C 200 66, 360 86, 500 90 C 650 94, 810 64, 1000 92 L1000 200 L0 200Z" fill="#b8e29e"/>
  </svg>
  <div class="half-night left" id="night-left"></div>
  <div class="half-night right" id="night-right"></div>
  <div id="night"><div id="moon"></div></div>
  <div class="girl-name" id="name-left"></div>
  <div class="girl-name" id="name-right"></div>
  <div id="center">
    <div id="jar"></div>
    <div id="games"></div>
    <div id="gamebar"><div id="dots"></div><div class="cbtn" id="home-btn"></div></div>
  </div>
  <div id="world"></div>

      for (const re of liked) {
        const v = voices.find(x => re.test(x.name));
        if (v) { this.voice = v; return; }

      this.voice = voices.find(v => /en[-_]US/i.test(v.lang)) || voices[0] || null;
    };
    choose();

    else speechSynthesis.onvoiceschanged = choose;

    if (i) container.append(' ');
    const s = el('span', 'word');
    s.textContent = w;
    s.dataset.say = w.replace(/[^A-Za-z']/g, '');
    container.append(s);
  });
}
/* One tappable chunk (for names). */
function sayableInto(container, text) {
  container.innerHTML = '';
  const s = el('span', 'word');
  s.textContent = text; s.dataset.say = text;
  container.append(s);
}
let wordDown = null;
document.addEventListener('pointerdown', e => {
  wordDown = e.target.closest && e.target.closest('.word');
  if (wordDown) e.preventDefault();
});
document.addEventListener('pointerup', e => {
  const w = e.target.closest && e.target.closest('.word');
  if (!w || w !== wordDown) return;
  wordDown = null;
  Sound.unlock();
  Speech.say(w.dataset.say || w.textContent);
  w.classList.remove('said'); void w.offsetWidth; w.classList.add('said');
});

/* =====================================================================
   8. THE SCREEN
   ===================================================================== */
const stage = $('#stage');
const world = $('#world');
const cols = { left: $('#col-left'), right: $('#col-right') };
const pets = {};
const HOME   = { left: { x: 29.5, y: 12 }, right: { x: 70.5, y: 12 } };
const CUDDLE = { left: { x: 41.5, y: 12 }, right: { x: 58.5, y: 12 } };

let scene = 'boot';   // boot, pick, title, play, chase, goodnight, night, morning
function setScene(s) {
  if (s !== 'play') SIDES.forEach(side => { inviteUntil[side] = {}; });
  scene = s;
  document.body.dataset.scene = s;
  renderColumns();
}

function applyColors(left = S.colors.left, right = S.colors.right) {
  const r = document.documentElement.style;
  const L = colorById(left), R = colorById(right);
  const set = (p, c) => {
    if (c) { r.setProperty(p, c.main); r.setProperty(p + '-light', c.light); r.setProperty(p + '-dark', c.dark); }
    else { r.removeProperty(p); r.removeProperty(p + '-light'); r.removeProperty(p + '-dark'); }
  };
  set('--L', L); set('--R', R);
}

function fillArt(box, side, useDrawing) {
  const cfg = PET_ART[side];
  box.innerHTML = '';
  const photo = cfg.awake && !useDrawing;
  box.classList.toggle('photo', !!photo);
  box.classList.toggle('has-asleep', !!(photo && cfg.asleep));
  if (photo) {
    const add = (src, cls) => {
      const img = new Image();
      img.className = cls; img.alt = ''; img.draggable = false;
      img.onerror = () => fillArt(box, side, true); // file missing? use the drawing
      img.src = src;
      box.append(img);
    };
    add(cfg.awake, 'img-awake');
    if (cfg.asleep) add(cfg.asleep, 'img-asleep');
  } else {
    box.append(document.getElementById(cfg.drawing).content.cloneNode(true));
  }
}

function buildScene() {
  // stars for night time
  const night = $('#night');
  $('#moon').innerHTML = ICONS.moonBig;
  for (let i = 0; i < 26; i++) {
    const s = el('div', 'star');
    s.style.left = rand(3, 97) + '%'; s.style.top = rand(3, 55) + '%';
    s.style.animationDelay = rand(-3, 0) + 's';
    night.append(s);
  }
  SIDES.forEach(side => {
    const half = $('#night-' + side);
    for (let i = 0; i < 9; i++) {
      const s = el('div', 'star');

      s.style.top = rand(4, 50) + '%';
      s.style.animationDelay = rand(-3, 0) + 's';
      half.append(s);
    }
    sayableInto($('#name-' + side), SETTINGS.players[side].girl);
  });

    };

/* ---------- where things are on screen ---------- */
const W = () => stage.clientWidth;
const H = () => stage.clientHeight;
const petSize = () => Math.min(W(), H()) * 0.33;
function setPos(p, x, y) {
  p.x = x; p.y = y;
  p.root.style.left = x + '%';
  p.root.style.bottom = y + '%';
}
/* A point on a pet: fx, fy go from 0 to 1 across the pet's picture (0,0 is top-left). */
function petPoint(p, fx, fy) {
  const s = petSize(), cx = p.x / 100 * W(), bottom = H() - p.y / 100 * H();
  return { x: cx + (fx - 0.5) * s, y: bottom - s + fy * s };
}
function movePet(side, x, y, ms) {
  const p = pets[side], x0 = p.x, y0 = p.y;
  p.root.classList.add('walking');
  return tween(ms, t => setPos(p, x0 + (x - x0) * t, y0 + (y - y0) * t))
    .then(() => p.root.classList.remove('walking'));
}

/* ---------- flying things (food, treats, hearts) ---------- */
function prop(svg, sizeVmin, x, y) {
  const outer = el('div', 'prop');
  const inner = el('div', '', svg);
  outer.append(inner);
  outer.style.width = outer.style.height = sizeVmin + 'vmin';
  outer.style.left = x + 'px'; outer.style.top = y + 'px';
  world.append(outer);
  return outer;
}
function floatHearts(p, n = 3, color = '#ff6f91') {
  for (let i = 0; i < n; i++) {
    const pt = petPoint(p, 0.5 + rand(-0.3, 0.3), 0.18 + rand(-0.05, 0.1));
    const h = prop(ICONS.heart, rand(4, 6), pt.x, pt.y);
    h.style.color = color; h.style.zIndex = 31;
    animate(h.firstChild, [
      { transform: 'translateY(0) scale(.3)', opacity: 0 },
      { transform: 'translateY(-3vmin) scale(1)', opacity: 1, offset: 0.2 },
      { transform: 'translateY(-17vmin) scale(.9)', opacity: 0 },
    ], { duration: 1500, delay: i * 140, easing: 'ease-out', fill: 'both' }).then(() => h.remove());
  }
}
function sparkles(x, y, n = 8, colors = ['#ffd23f', '#ff7eb6', '#5aa9ff', '#6cc551']) {
  for (let i = 0; i < n; i++) {
    const s = prop(ICONS.star, rand(2.5, 4.5), x, y);
    s.style.color = pick(colors); s.style.zIndex = 32;
    const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), d = rand(8, 15);
    animate(s.firstChild, [
      { transform: 'translate(0,0) scale(.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}vmin, ${Math.sin(a) * d}vmin) scale(1) rotate(160deg)`, opacity: 0 },
    ], { duration: 900, easing: 'ease-out', fill: 'both' }).then(() => s.remove());
  }
}
/* A speech bubble above a pet: "Thank you, Leah!" (each word can be tapped). */
function sayBubble(p, text, ms = 2800) {
  p.root.querySelectorAll('.say').forEach(b => b.remove());
  const b = el('div', 'say');
  wordsInto(b, text);
  p.root.append(b);
  animate(b, [{ transform: 'translateX(-50%) scale(0)' }, { transform: 'translateX(-50%) scale(1.08)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 350, easing: 'ease-out' });
  setTimeout(() => {
    animate(b, [{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).then(() => b.remove());
  }, ms);
}

/* =====================================================================
   9. THE PETS: eat, play, sleep, and being tapped
   ===================================================================== */
/* Start a new action on a pet. Cancels whatever it was doing.
   Returns a function that says whether this action is still the current one. */
function begin(p, ms = 1600) {
  const t = ++p.token;
  p.anims.forEach(a => a.cancel && a.cancel());
  p.anims = [];
  p.root.querySelectorAll('.prop-own').forEach(e => e.remove());
  document.querySelectorAll('.prop[data-owner="' + p.side + '"]').forEach(e => e.remove());
  clearTimeout(p.moodTimer);
  p.root.classList.remove('chomp', 'happy');
  p.busyUntil = now() + ms;
  return () => t === p.token;
}
function petAnim(p, frames, opts) {
  const done = animate(p.bounce, frames, opts);
  if (done.anim) p.anims.push(done.anim);
  return done;
}
function mood(p, cls, ms) {
  p.root.classList.add(cls);
  clearTimeout(p.moodTimer);
  p.moodTimer = setTimeout(() => p.root.classList.remove(cls), ms);
}
const canAct = () => scene === 'play';

async function feed(side, food) {
  if (!canAct()) return;
  const p = pets[side];
  if (p.asleep) wakePet(side, true);
  const alive = begin(p, 1900);
  food = food || pick(FOODS);
  const pt = petPoint(p, 0.5, 0.72);
  const f = prop(ICONS[food], 12, pt.x, pt.y);
  f.dataset.owner = side;
  Sound.play('eat');
  await animate(f.firstChild, [{ transform: 'scale(0) translateY(-6vmin)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out', fill: 'both' });
  for (let i = 0; i < 3; i++) {
    if (!alive()) return;
    p.root.classList.add('chomp');
    petAnim(p, [{ transform: 'scale(1,1)' }, { transform: 'scale(1.05,.94)' }, { transform: 'scale(1,1)' }], { duration: 200 });
    await wait(130);
    f.firstChild.style.transform = `scale(${0.75 - i * 0.25})`;
    p.root.classList.remove('chomp');
    await wait(90);
  }
  if (!alive()) return;
  f.remove();
  mood(p, 'happy', 1300);
  floatHearts(p, 3);
  petAnim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-7%)' }, { transform: 'translateY(0)' }], { duration: 380, easing: 'ease-out' });
}

const lastPlay = { left: -1e9, right: -1e9 };
async function playBall(side) {
  if (!canAct()) return;
  const p = pets[side], o = other(side);
  if (p.asleep) wakePet(side, true);
  // Both girls tapped Play close together? Chase time!
  const t = now();
  lastPlay[side] = t;
  if (t - lastPlay[o] < SETTINGS.togetherWindowMs && !pets[o].asleep) {
    lastPlay.left = lastPlay.right = -1e9;
    startChase();
    return;
  }
  if (!pets[o].asleep) invite(o, 'play', SETTINGS.togetherWindowMs);
  const alive = begin(p, 1700);
  mood(p, 'happy', 1600);
  Sound.play('play');
  const base = petPoint(p, 0.5, 0.95);
  const ball = prop(ICONS.ball, 9, base.x + (side === 'left' ? 1 : -1) * petSize() * 0.38, base.y - petSize() * 0.06);
  ball.dataset.owner = side;
  animate(ball.firstChild, [
    { transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-22vmin) rotate(180deg)', offset: 0.3 },
    { transform: 'translateY(0) rotate(360deg)', offset: 0.55 }, { transform: 'translateY(-10vmin) rotate(480deg)', offset: 0.75 },
    { transform: 'translateY(0) rotate(560deg)' },
  ], { duration: 1500, easing: 'ease-in-out' }).then(() => ball.remove());
  await petAnim(p, [
    { transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-16%) rotate(-8deg)', offset: 0.25 },
    { transform: 'translateY(0) rotate(0)', offset: 0.5 }, { transform: 'translateY(-11%) rotate(8deg)', offset: 0.75 },
    { transform: 'translateY(0) rotate(0)' },
  ], { duration: 1400, easing: 'ease-in-out' });
  if (!alive()) return;
  p.root.classList.add('wag');
  setTimeout(() => p.root.classList.remove('wag'), 1600);
}

function goSleep(side) {
  if (!canAct()) return;
  const p = pets[side];
  begin(p, 800);
  p.asleep = true; S.pets[side].asleep = true; save();
  p.root.classList.add('asleep');
  $('#night-' + side).classList.add('on');
  Sound.play('sleep');
  renderColumn(side);
  updateGameButtons();
  if (!pets[other(side)].asleep) invite(other(side), 'sleep', 5000);
  checkBothAsleep();
}
function wakePet(side, quiet) {
  const p = pets[side];
  p.asleep = false; S.pets[side].asleep = false; save();
  p.root.classList.remove('asleep');
  $('#night-' + side).classList.remove('on');
  if (!quiet) {
    begin(p, 900);
    Sound.play('wake');
    mood(p, 'happy', 1200);
    petAnim(p, [{ transform: 'scale(1,1)' }, { transform: 'scale(.94,1.1)' }, { transform: 'scale(1,1)' }], { duration: 700, easing: 'ease-out' });
  }
  renderColumn(side);
  updateGameButtons();
}

function petTapped(side) {
  const p = pets[side];
  if (scene === 'night') { goodMorning(); return; }
  if (!canAct()) return;
  if (p.asleep) { wakePet(side); return; }
  begin(p, 1000);
  mood(p, 'happy', 1100);
  Sound.play('giggle');
  floatHearts(p, 2);
  p.root.classList.add('wag'); setTimeout(() => p.root.classList.remove('wag'), 1600);
  petAnim(p, [{ transform: 'rotate(0)' }, { transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0)' }], { duration: 650 });
}

/* =====================================================================
   10. TOGETHER MOMENTS (in the shared middle)
   ===================================================================== */
let lastTreatMoment = -1e9;
function togetherMoment(type) {
  // Treats can be tossed quickly back and forth; count them only now and then.
  if (type === 'treat') {
    if (now() - lastTreatMoment < 15000) return;
    lastTreatMoment = now();
  }
  S.together++;
  logDay(type);
  addHeart();
  checkUnlocks();
  save();
  setTimeout(runQueue, 1600);
}
/* Remember what the pets did together today (for the memory book). */
function logDay(type) {
  const key = todayKey();
  const day = S.book[key] || (S.book[key] = []);
  if (!day.includes(type)) day.push(type);
  const keys = Object.keys(S.book).sort();
  while (keys.length > 120) delete S.book[keys.shift()];
}

/* --- Treat: toss a treat to your sister's pet --- */
const treatFlying = { left: false, right: false };
async function giveTreat(side, btn) {
  if (!canAct()) return;
  const o = other(side), pf = pets[side], pt = pets[o];
  if (pt.asleep || treatFlying[side]) { nudge(btn); return; }
  if (pf.asleep) wakePet(side, true);
  treatFlying[side] = true;
  begin(pf, 700);
  petAnim(pf, [{ transform: 'translateY(0)' }, { transform: 'translateY(-8%) rotate(' + (side === 'left' ? 6 : -6) + 'deg)' }, { transform: 'translateY(0)' }], { duration: 450 });
  Sound.play('toss');
  const a = petPoint(pf, 0.5, 0.5);
  const tr = prop(ICONS.treat, 9, a.x, a.y);
  tr.style.zIndex = 33;
  const peak = H() * 0.3;
  await tween(950, t => {
    const b = petPoint(pt, 0.5, 0.55);
    const x = a.x + (b.x - a.x) * t;
    const y = a.y + (b.y - a.y) * t - peak * 4 * t * (1 - t);
    tr.style.left = x + 'px'; tr.style.top = y + 'px';
    tr.firstChild.style.transform = `rotate(${t * (side === 'left' ? 540 : -540)}deg)`;
  }, ease.linear);
  treatFlying[side] = false;
  if (pt.asleep || !canAct()) { // fell asleep while it was flying: the treat waits by her bed
    animate(tr, [{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' }).then(() => tr.remove());
    return;
  }
  const alive = begin(pt, 1600);
  Sound.play('catch');
  tr.remove();
  pt.root.classList.add('chomp');
  await petAnim(pt, [{ transform: 'translateY(0)' }, { transform: 'translateY(-10%)' }, { transform: 'translateY(0) scale(1.04,.96)' }, { transform: 'none' }], { duration: 500, easing: 'ease-out' });
  if (!alive()) return;
  pt.root.classList.remove('chomp');
  mood(pt, 'happy', 2000);
  floatHearts(pt, 4);
  Sound.play('thanks');
  sayBubble(pt, 'Thank you, ' + SETTINGS.players[side].girl + '!');
  togetherMoment('treat');
}

/* --- Chase: both tapped Play at nearly the same time --- */
async function startChase() {
  setScene('chase');
  SIDES.forEach(s => { begin(pets[s], 7000); pets[s].root.classList.add('happy', 'running'); });
  Sound.play('chase');
  const cx = 50, cy = 15, rx = 14, ry = 5;
  await Promise.all([movePet('left', cx - rx, cy, 500), movePet('right', cx + rx, cy, 500)]);
  SIDES.forEach(s => pets[s].root.classList.add('running'));
  const place = (side, ang) => {
    const p = pets[side];
    setPos(p, cx + rx * Math.cos(ang), cy + ry * Math.sin(ang));
    const depth = Math.sin(ang);                       // 1 = far away, -1 = close
    const dir = -Math.sin(ang) >= 0 ? 1 : -1;          // moving right or left
    p.root.style.zIndex = depth > 0 ? 9 : 11;
    p.lean.style.transform = `rotate(${dir * 9}deg) scale(${0.9 - depth * 0.08})`;
  };
  await tween(4800, t => {
    const a = t * Math.PI * 4;                         // two laps
    place('left', Math.PI + a);
    place('right', a);
  }, ease.linear);
  SIDES.forEach(s => { pets[s].lean.style.transform = ''; pets[s].root.style.zIndex = ''; });
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 700), movePet('right', HOME.right.x, HOME.right.y, 700)]);
  SIDES.forEach(s => { pets[s].root.classList.remove('running'); floatHearts(pets[s], 3); mood(pets[s], 'happy', 1500); });
  togetherMoment('chase');
  endScene();
}

/* --- Goodnight: both pets asleep --- */
let bothAsleepTimer = 0;
function checkBothAsleep() {
  clearTimeout(bothAsleepTimer);
  if (!(pets.left.asleep && pets.right.asleep)) return;
  bothAsleepTimer = setTimeout(() => {
    if (pets.left.asleep && pets.right.asleep && scene === 'play') goodnight();
  }, 1400);
}
async function goodnight() {
  setScene('goodnight');
  SIDES.forEach(s => { begin(pets[s], 5000); $('#night-' + s).classList.remove('on'); });
  $('#night').classList.add('on');
  Sound.play('lullaby');
  await wait(700);
  await Promise.all([movePet('left', CUDDLE.left.x, CUDDLE.left.y, 2200), movePet('right', CUDDLE.right.x, CUDDLE.right.y, 2200)]);
  pets.left.lean.style.transform = 'rotate(7deg)';
  pets.right.lean.style.transform = 'rotate(-7deg)';
  $('#goodnight').classList.add('on');
  SIDES.forEach(s => floatHearts(pets[s], 2, '#ffd6e4'));
  togetherMoment('sleep');
  await wait(1200);
  if (scene === 'goodnight') setScene('night');
}
/* Put the pets back the way they were last time (asleep or awake). */
function restorePets() {
  const bothAsleep = S.pets.left.asleep && S.pets.right.asleep;
  SIDES.forEach(s => {
    const p = pets[s];
    p.asleep = !!S.pets[s].asleep;
    p.root.classList.toggle('asleep', p.asleep);
    $('#night-' + s).classList.toggle('on', p.asleep && !bothAsleep);
    setPos(p, (bothAsleep ? CUDDLE : HOME)[s].x, (bothAsleep ? CUDDLE : HOME)[s].y);
  });
  pets.left.lean.style.transform = bothAsleep ? 'rotate(7deg)' : '';
  pets.right.lean.style.transform = bothAsleep ? 'rotate(-7deg)' : '';
  $('#night').classList.toggle('on', bothAsleep);
  $('#goodnight').classList.toggle('on', bothAsleep);
  updateGameButtons();
  return bothAsleep ? 'night' : 'play';
}
async function goodMorning() {
  if (scene !== 'night') return;
  setScene('morning');
  Sound.stopMusic();
  Sound.play('morning');
  $('#goodnight').classList.remove('on');
  $('#night').classList.remove('on');
  SIDES.forEach(s => {
    const p = pets[s];
    p.asleep = false; S.pets[s].asleep = false;
    p.root.classList.remove('asleep');
    p.lean.style.transform = '';
    mood(p, 'happy', 2600);
  });
  save();
  await wait(500);
  await Promise.all([movePet('left', HOME.left.x, HOME.left.y, 1200), movePet('right', HOME.right.x, HOME.right.y, 1200)]);
  SIDES.forEach(s => floatHearts(pets[s], 2));
  endScene();
}

function endScene() {
  setScene('play');
  setTimeout(runQueue, 500);
}

/* =====================================================================
   11. NEW THINGS APPEAR, ONE AT A TIME
   ===================================================================== */
const queue = [];
function checkUnlocks() {
  for (const [key, at] of Object.entries(SETTINGS.unlockAt)) {
    if (S.together >= at && !S.unlocked[key] && !queue.includes(key)) queue.push(key);
  }
}
let queueBusy = false;
async function runQueue() {
  if (scene !== 'play' || queueBusy) return;
  if (S.unlocked.jar && S.jar >= SETTINGS.jarSize) { startGift(); return; }   // a full jar comes first
  if (!queue.length) return;
  queueBusy = true;
  await reveal(queue.shift());
  queueBusy = false;
  setTimeout(runQueue, 1500);
}
const newUntil = {};
async function reveal(key) {
  S.unlocked[key] = true; save();
  Sound.play('unlock');
  if (key === 'treat') {
    newUntil.treat = Date.now() + 6000;
    renderColumns();
  } else if (key === 'jar') {
    renderJar();
    const jar = $('#jar');
    jar.classList.add('pop');
    setTimeout(() => jar.classList.remove('pop'), 1000);
    await wait(1100);
    await addHeart();      // the together moment that brought the jar
  } else if (GAMES[key]) {
    newUntil[key] = Date.now() + 6000;
    renderGames();
  }
}

/* =====================================================================
   12. THE FRIENDSHIP JAR (one jar, shared by both girls)
   ===================================================================== */
function jarSlots() {
  const n = SETTINGS.jarSize, xs = [30, 50, 70], out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / 3), inRow = Math.min(3, n - row * 3), col = i % 3;
    const x = inRow === 1 ? 50 : inRow === 2 ? [40, 60][col] : xs[col];
    out.push([x, 104 - row * 17]);
  }
  return out;
}
function renderJar() {
  const jar = $('#jar');
  jar.classList.toggle('show', !!S.unlocked.jar);
  jar.classList.toggle('full', S.jar >= SETTINGS.jarSize);
  const hearts = jarSlots().map(([x, y], i) => {
    const inner = (i < S.jar ? ICONS.twinHeart : ICONS.emptyHeart).replace('<svg ', `<svg x="${x - 10.5}" y="${y - 10.5}" width="21" height="21" `);
    return inner;
  }).join('');

/* =====================================================================

const GAMES = {

function updateGameButtons() {

}
function renderDots() {

async function startGame(kind, starter, btn) {

function showTurn() {

function hopPet(side) {

    Sound.play('yay');

/* Throw something in an arc. b may be a function so it can follow a moving target. */
function arc(elm, a, b, ms, peak, spin = 0) {
  return tween(ms, t => {
    const end = typeof b === 'function' ? b() : b;
    elm.style.left = a.x + (end.x - a.x) * t + 'px';
    elm.style.top = a.y + (end.y - a.y) * t - peak * 4 * t * (1 - t) + 'px';
    if (spin) elm.firstChild.style.transform = `rotate(${t * spin}deg)`;
  }, ease.linear);
}

const GAME_SETUP = {
  async ball(g) {
    await Promise.all([movePet('left', 36, 12, 700), movePet('right', 64, 12, 700)]);
    const pt = petPoint(pets[g.turn], 0.5, 0.78);
    g.ball = prop(ICONS.ball, 8, pt.x, pt.y);
    g.ball.style.zIndex = 12;
    g.cleanup.push(() => g.ball.remove());
  },
  async seesaw(g) {
    g.base = el('div', 'seesaw-base', ICONS.seesawBase);
    g.plank = el('div', 'seesaw-plank');
    world.append(g.base, g.plank);
    g.cleanup.push(() => { g.base.remove(); g.plank.remove(); });
    g.tilt = g.turn === 'left' ? 1 : -1;            // whoever started goes first (her side is down)
    const ends = seesawEnds(g.tilt);
    await Promise.all(SIDES.map(s => movePet(s, ends[s].x, ends[s].y, 700)));
    layoutSeesaw(g);
  },
  async highfive(g) {
    await Promise.all([movePet('left', 40, 12, 700), movePet('right', 60, 12, 700)]);
    g.paws = {};
    SIDES.forEach(s => {
      const paw = prop(pawSvg(s), 10, 0, 0);
      paw.style.zIndex = 12; paw.style.opacity = 0;
      g.paws[s] = paw;
      g.cleanup.push(() => paw.remove());
    });
  },
};
const GAME_PRESS = {
  async ball(g, side) {
    if (side !== g.turn) { hopPet(side); return; }
    g.busy = true;
    const from = pets[side], to = pets[other(side)];
    Sound.play('throw');
    petAnim(from, [{ transform: 'translateY(0)' }, { transform: 'translateY(-6%) rotate(' + (side === 'left' ? 8 : -8) + 'deg)' }, { transform: 'translateY(0)' }], { duration: 400 });
    await arc(g.ball, petPoint(from, 0.5, 0.78), () => petPoint(to, 0.5, 0.6), 950, H() * 0.32, side === 'left' ? 400 : -400);
    Sound.play('catch');
    mood(to, 'happy', 1000);
    petAnim(to, [{ transform: 'translateY(0)' }, { transform: 'translateY(-9%)' }, { transform: 'translateY(0)' }], { duration: 420, easing: 'ease-out' });
    const rest = petPoint(to, 0.5, 0.78);
    await arc(g.ball, petPoint(to, 0.5, 0.6), rest, 200, 0);
    g.turn = other(side);
    g.busy = false;
    await scorePoint();
  },
  async seesaw(g, side) {
    const downSide = g.tilt > 0 ? 'left' : 'right';
    if (side !== downSide) { hopPet(side); return; }
    g.busy = true;
    Sound.play('seesaw');
    mood(pets[side], 'happy', 1300);
    const from = g.tilt, to = -g.tilt;
    await tween(650, t => { g.tilt = from + (to - from) * t; layoutSeesaw(g); }, ease.inOut);
    hopPet(other(side));
    g.turn = other(side);
    g.busy = false;
    await scorePoint();
  },
  async highfive(g, side) {
    const t = now(), o = other(side);
    g.raised[side] = t;
    Sound.play('pawUp');
    mood(pets[side], 'happy', 1200);
    const paw = g.paws[side];
    paw.style.opacity = 1;
    const down = pawSpot(side, false), up = pawSpot(side, true);
    if (t - g.raised[o] < 1200) {
      // both pressed: HIGH FIVE!
      g.busy = true;
      g.raised = { left: -1e9, right: -1e9 };
      const meet = { x: (pawSpot('left', true).x + pawSpot('right', true).x) / 2, y: up.y - H() * 0.03 };
      await Promise.all(SIDES.map(s => {
        const p = g.paws[s], st = s === side ? down : { x: parseFloat(p.style.left), y: parseFloat(p.style.top) };
        p.style.opacity = 1;
        const end = { x: meet.x + (s === 'left' ? -1 : 1) * petSize() * 0.07, y: meet.y };
        return arc(p, st, end, 180, 0);
      }));
      Sound.play('clap');
      sparkles(meet.x, meet.y, 12);
      SIDES.forEach(s => { mood(pets[s], 'happy', 1200); hopPet(s); });
      await wait(650);
      SIDES.forEach(s => { g.paws[s].style.opacity = 0; });
      g.busy = false;
      await scorePoint();
      return;
    }
    // only one paw up so far: wait for the sister
    await arc(paw, down, up, 180, 0);
    setTimeout(() => {
      if (g.raised[side] === t && game === g) paw.style.opacity = 0;
    }, 1200);
  },
};

/* seesaw math: tilt 1 = left side down, -1 = right side down */
function seesawGeom() { return { cx: W() / 2, yp: H() * 0.16, hl: Math.min(W() * 0.17, H() * 0.3) }; }
function seesawEnds(tilt) {
  const { cx, yp, hl } = seesawGeom(), th = tilt * 12 * Math.PI / 180, lift = H() * 0.012;
  return {
    left:  { x: (cx - hl * Math.cos(th)) / W() * 100, y: (yp - hl * Math.sin(th) + lift) / H() * 100 },
    right: { x: (cx + hl * Math.cos(th)) / W() * 100, y: (yp + hl * Math.sin(th) + lift) / H() * 100 },
  };
}
function layoutSeesaw(g) {
  const { cx, yp, hl } = seesawGeom(), len = 2 * hl + petSize() * 0.4, thick = Math.min(W(), H()) * 0.028;
  Object.assign(g.plank.style, { left: cx - len / 2 + 'px', width: len + 'px', bottom: yp - thick / 2 + 'px', transform: `rotate(${-g.tilt * 12}deg)` });
  const bh = yp - H() * 0.05, bw = bh * 1.2;
  Object.assign(g.base.style, { left: cx - bw / 2 + 'px', width: bw + 'px', bottom: H() * 0.05 + 'px', height: bh + 'px' });
  const ends = seesawEnds(g.tilt);
  SIDES.forEach(s => setPos(pets[s], ends[s].x, ends[s].y));
}

/* high five paws */
const PAWS = {
  left:  { fur: '#eef1f6', line: '#8b94a3', pad: '#ffc6d6' },
  right: { fur: '#fffaf3', line: '#cbb9a8', pad: '#f3b9a8' },
};
function pawSvg(side) {
  const c = PAWS[side];
  return `<svg viewBox="0 0 100 100"><ellipse cx="50" cy="56" rx="32" ry="30" fill="${c.fur}" stroke="${c.line}" stroke-width="5"/><ellipse cx="50" cy="66" rx="15" ry="12" fill="${c.pad}"/><circle cx="29" cy="44" r="7" fill="${c.pad}"/><circle cx="43" cy="35" r="7" fill="${c.pad}"/><circle cx="57" cy="35" r="7" fill="${c.pad}"/><circle cx="71" cy="44" r="7" fill="${c.pad}"/></svg>`;
}
function pawSpot(side, raised) {
  const inner = side === 'left' ? 0.84 : 0.16;
  return petPoint(pets[side], inner, raised ? 0.12 : 0.62);
}

   12. THE BUTTON STRIPS
   ===================================================================== */
const BUTTONS = {
  eat:   { icon: 'apple', label: 'Eat' },
  play:  { icon: 'ball',  label: 'Play' },
  sleep: { icon: 'moon',  label: 'Sleep' },
  wake:  { icon: 'sun',   label: 'Wake' },
  treat: { icon: 'treat', label: 'Treat' },
  throw: { icon: 'ball',  label: 'Throw' },
  push:  { icon: 'seesaw', label: 'Push' },
  five:  { icon: 'hand',  label: 'High five' },
  gift:  { icon: 'gift',  label: 'Open' },
};
const inviteUntil = { left: {}, right: {} };
function columnPlan(side) {
  if (scene === 'night') return { acts: ['wake'], big: true };
  if (scene === 'game' && game) return { acts: [GAMES[game.kind].act], big: true };
  if (scene === 'gift' && gift) return { acts: ['gift'], big: true, cls: gift.pulled[side] ? 'done' : 'invite' };
  const acts = ['eat', 'play', pets[side] && pets[side].asleep ? 'wake' : 'sleep'];
  if (S.unlocked.treat) acts.push('treat');
  return { acts, dim: !['play', 'title'].includes(scene) };
}
function renderColumns() { SIDES.forEach(renderColumn); }
function renderColumn(side) {
  const col = cols[side];
  const plan = columnPlan(side);
  col.innerHTML = '';
  col.classList.toggle('big', !!plan.big);
  col.classList.toggle('dim', !!plan.dim);
  for (const act of plan.acts) {
    const def = BUTTONS[act];
    const b = el('div', 'btn btn-' + act, `<span class="ico">${ICONS[def.icon]}</span><span class="lbl">${def.label}</span>`);
    b.dataset.act = act;
    if (plan.cls) b.classList.add(plan.cls);
    if ((newUntil[act] || 0) > Date.now()) b.classList.add('new');
    if ((inviteUntil[side][act] || 0) > Date.now()) b.classList.add('invite');
    onPress(b, () => press(side, act, b));
    col.append(b);
  }
}
function press(side, act, btn) {
  if (scene === 'night') { if (act === 'wake') goodMorning(); return; }
  if (scene === 'game') { gamePress(side, btn); return; }
  if (scene === 'gift') { pullRibbon(side, btn); return; }
  if (!canAct()) return;
  if (act === 'eat') feed(side);
  else if (act === 'play') playBall(side);
  else if (act === 'sleep') goSleep(side);
  else if (act === 'wake') wakePet(side);
  else if (act === 'treat') giveTreat(side, btn);
}
/* Gently glow a button on the sister's side ("come join in!"). */
function invite(side, act, ms) {
  inviteUntil[side][act] = Date.now() + ms;
  const b = cols[side].querySelector('.btn-' + act);
  if (b) b.classList.add('invite');
  setTimeout(() => {
    const b2 = cols[side].querySelector('.btn-' + act);
    if (b2 && (inviteUntil[side][act] || 0) <= Date.now()) b2.classList.remove('invite');
  }, ms + 50);
}
function nudge(elm) {
  if (!elm) return;
  Sound.play('soft');
  elm.classList.remove('nudge'); void elm.offsetWidth; elm.classList.add('nudge');
}

/* =====================================================================
   13. PETS WAIT HAPPILY (little idle wiggles)
   ===================================================================== */
function idleTick() {
  // nobody has tapped the game for a while: go back to normal, gently
  if (scene === 'game' && game && game.ready && !game.busy && now() - game.lastPress > 25000) finishGame(false);
  if (!['play', 'title'].includes(scene)) return;
  SIDES.forEach(side => {
    const p = pets[side];
    if (p.asleep || now() < p.busyUntil || Math.random() > 0.2) return;
    p.busyUntil = now() + 1800;
    const what = pick(['wag', 'hop', 'look', 'wag']);
    if (what === 'wag') { p.root.classList.add('wag'); setTimeout(() => p.root.classList.remove('wag'), 1600); }
    if (what === 'hop') petAnim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-5%)' }, { transform: 'translateY(0)' }], { duration: 420, easing: 'ease-out' });
    if (what === 'look') {
      const dir = side === 'left' ? 1 : -1;
      petAnim(p, [{ transform: 'rotate(0)' }, { transform: `rotate(${dir * 6}deg)`, offset: 0.25 }, { transform: `rotate(${dir * 6}deg)`, offset: 0.75 }, { transform: 'rotate(0)' }], { duration: 1500 });
    }
  });
}

/* =====================================================================
   14. FIRST LAUNCH: PICK A COLOR
   ===================================================================== */
const picking = { left: null, right: null };
function openPicker() {
  setScene('pick');
  picking.left = S.colors.left; picking.right = S.colors.right;
  $('#title').classList.remove('show');
  const picker = $('#picker');
  picker.classList.add('show');
  picker.querySelectorAll('.pick-half').forEach(half => {
    const side = half.dataset.side;
    sayableInto(half.querySelector('.pick-name'), SETTINGS.players[side].girl);
    const petBox = half.querySelector('.pick-pet');
    fillArt(petBox, side);
    const sw = half.querySelector('.swatches');
    sw.innerHTML = '';
    COLORS.forEach(c => {
      const b = el('div', 'swatch', ICONS.check);
      b.style.setProperty('--sw', c.main);
      b.dataset.color = c.id;
      onTap(b, () => chooseColor(side, c.id, b));
      sw.append(b);
    });
  });
  updatePicker();
}
function chooseColor(side, id, b) {
  if (picking[other(side)] === id) { nudge(b); return; }   // sister already has it
  picking[side] = id;
  Sound.play('pick');
  const petBox = $(`.pick-half[data-side="${side}"] .pick-pet`);
  animate(petBox, [{ transform: 'translateY(0)' }, { transform: 'translateY(-12%)' }, { transform: 'translateY(0)' }], { duration: 420, easing: 'ease-out' });
  updatePicker();
}
function updatePicker() {
  $('#picker').querySelectorAll('.pick-half').forEach(half => {
    const side = half.dataset.side, mine = colorById(picking[side]);
    half.style.setProperty('--pbg', mine ? mine.light : '#f4efe9');
    half.style.setProperty('--pdark', mine ? mine.dark : '#6f6880');
    half.querySelectorAll('.swatch').forEach(b => {
      b.classList.toggle('chosen', b.dataset.color === picking[side]);
      b.classList.toggle('taken', b.dataset.color === picking[other(side)]);
    });
  });
  $('#go-btn').classList.toggle('show', !!(picking.left && picking.right));
}
function finishPicking() {
  if (!(picking.left && picking.right)) return;
  S.colors.left = picking.left; S.colors.right = picking.right; save();
  applyColors();
  makeHomeScreenIcon();
  $('#picker').classList.remove('show');
  startPlaying();
}

/* =====================================================================
   15. START SCREEN, FULL SCREEN, HOME SCREEN ICON
   ===================================================================== */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
function canFullscreen() {
  const d = document.documentElement;
  return !isIOS() && !isStandalone() && !!(d.requestFullscreen || d.webkitRequestFullscreen);
}
function tryFullscreen() {
  if (!canFullscreen() || document.fullscreenElement || document.webkitFullscreenElement) return;
  const d = document.documentElement;
  try {
    const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d);
    if (r && r.catch) r.catch(() => {});
  } catch (e) { /* ignore */ }
}
function showTitle() {
  setScene('title');
  $('#title').classList.add('show');
}
function startPlaying() {
  $('#title').classList.remove('show');
  Sound.unlock();
  tryFullscreen();
  if (restorePets() === 'night') { setScene('night'); return; }
  setScene('play');
  setTimeout(() => { checkUnlocks(); runQueue(); }, 800);
}

/* The picture used when the game is saved to the home screen. */
function makeHomeScreenIcon() {
  const L = colorById(S.colors.left) || COLORS[0], R = colorById(S.colors.right) || COLORS[2];
  const draw = size => {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.fillStyle = L.light; g.fillRect(0, 0, size / 2, size);
    g.fillStyle = R.light; g.fillRect(size / 2, 0, size / 2, size);
    g.save();
    g.translate(size * 0.12, size * 0.14); g.scale(size * 0.0076, size * 0.0076);
    const heart = new Path2D('M50 88 C 18 66, 6 46, 12 30 C 18 14, 42 12, 50 30 C 58 12, 82 14, 88 30 C 94 46, 82 66, 50 88Z');
    g.save(); g.beginPath(); g.rect(0, 0, 50, 100); g.clip(); g.fillStyle = L.main; g.fill(heart); g.restore();
    g.save(); g.beginPath(); g.rect(50, 0, 50, 100); g.clip(); g.fillStyle = R.main; g.fill(heart); g.restore();
    g.restore();
    return c.toDataURL('image/png');
  };
  try {
    const i180 = draw(180), i192 = draw(192), i512 = draw(512);
    const link = (rel, href, extra) => {
      let l = document.querySelector(`link[rel="${rel}"]`);
      if (!l) { l = document.createElement('link'); l.rel = rel; document.head.append(l); }
      l.href = href;
      if (extra) Object.assign(l, extra);
    };
    link('apple-touch-icon', i180);
    link('icon', i192);
    const here = location.href.split('#')[0];
    const manifest = {
      name: 'Twin Pets', short_name: 'Twin Pets', start_url: here, scope: here.replace(/[^/]*$/, ''),
      display: 'standalone', display_override: ['fullscreen', 'standalone'], orientation: 'landscape',
      background_color: '#fff8ef', theme_color: '#fff8ef',
      icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }],
    };
    link('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest)));
  } catch (e) { /* not important */ }
}

/* =====================================================================
   16. GROWN-UP CORNER (press and hold the top-left corner for 3 seconds)
   ===================================================================== */
(function setupCorner() {
  const corner = $('#corner');
  let timer = 0;
  const stop = () => { clearTimeout(timer); corner.classList.remove('holding'); };
  corner.addEventListener('pointerdown', e => {
    e.preventDefault();
    corner.classList.add('holding');
    clearTimeout(timer);
    timer = setTimeout(() => { stop(); openParent(); }, 3000);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => corner.addEventListener(ev, stop));
})();
let resetArmed = 0;
function openParent() {
  resetArmed = 0;
  $('#parent').classList.add('show');
  renderParent();
}
function renderParent() {
  const v = Math.round(S.sound.volume * 10);
  let bars = '';
  for (let i = 1; i <= 10; i++) bars += `<i class="${i <= v ? 'on' : ''}"></i>`;
  $('#parent .panel').innerHTML = `
    <h2>Grown-ups</h2>
    <div class="row"><span>Sound</span><div class="pbtn ${S.sound.muted ? '' : 'on'}" data-p="mute">${S.sound.muted ? 'Off (tap to turn on)' : 'On (tap to mute)'}</div></div>
    <div class="row"><span>Volume</span><div class="pbtn round" data-p="vol-">−</div><div class="volbar">${bars}</div><div class="pbtn round" data-p="vol+">+</div></div>
    <div class="row"><div class="pbtn" data-p="colors">Change colors</div>${canFullscreen() ? '<div class="pbtn" data-p="fs">Full screen</div>' : ''}</div>
    <div class="row"><div class="pbtn" data-p="unlock">Show all new things now (for testing)</div></div>
    <div class="row"><div class="pbtn danger ${resetArmed ? 'confirm' : ''}" data-p="reset">${resetArmed ? 'Tap again to erase everything' : 'Start over'}</div></div>
    <div class="row"><div class="pbtn go" data-p="done">Done</div></div>
    <div class="note">Twin Pets saves on this device only.</div>`;
  $('#parent .panel').querySelectorAll('[data-p]').forEach(b => onRelease(b, () => parentAction(b.dataset.p)));
}
function parentAction(what) {
  if (what !== 'reset') resetArmed = 0;
  if (what === 'mute') {
    S.sound.muted = !S.sound.muted;
    if (S.sound.muted && 'speechSynthesis' in window) speechSynthesis.cancel();
    Sound.applyVolume();
    Sound.play('pick');
  } else if (what === 'vol-' || what === 'vol+') {
    S.sound.volume = Math.min(1, Math.max(0.1, Math.round((S.sound.volume + (what === 'vol+' ? 0.1 : -0.1)) * 10) / 10));
    Sound.applyVolume();
    Sound.play('pick');
  } else if (what === 'colors') {
    closeParent();
    openPicker();
    return;
  } else if (what === 'unlock') {
    S.together = Math.max(S.together, ...Object.values(SETTINGS.unlockAt));
    Object.keys(SETTINGS.unlockAt).forEach(k => { S.unlocked[k] = true; });
    queue.length = 0;
    renderJar(); renderGames(); renderColumns();
  } else if (what === 'fs') {
    tryFullscreen();
  } else if (what === 'reset') {
    if (resetArmed && Date.now() - resetArmed < 6000) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
      location.reload();
      return;
    }
    resetArmed = Date.now();
  } else if (what === 'done') {
    closeParent();
    return;
  }
  save();
  renderParent();
}
function closeParent() { $('#parent').classList.remove('show'); }

/* =====================================================================
   17. NO ZOOMING, NO SCROLLING, NO TEXT SELECTION, NO LONG-PRESS MENUS
   ===================================================================== */
['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
['touchend', 'pointerup', 'click'].forEach(ev => document.addEventListener(ev, () => Sound.unlock(), { passive: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* =====================================================================
   18. GO!
   ===================================================================== */
buildScene();
applyColors();
$('#home-btn').innerHTML = ICONS.home;
onPress($('#home-btn'), () => finishGame(false));
renderJar();
renderGames();
Speech.init();
makeHomeScreenIcon();
onRelease($('#title'), startPlaying);
onRelease($('#go-btn'), finishPicking);
setInterval(idleTick, 1000);
restorePets();
if (S.colors.left && S.colors.right) showTitle(); else openPicker();
</script>
</body>
</html>
